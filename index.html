<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>心园 · 借景明心</title>
<meta name="description" content="生辰定气局，情志归五脏。每日一园，看见自己的心境四季。">
<meta name="theme-color" content="#F7F2E6">
<meta property="og:type" content="website">
<meta property="og:title" content="心园 · 借景明心">
<meta property="og:description" content="不是情绪测试，是一座会随你心境生长的私人园林。">
<style>
:root{
  --paper:#F7F2E6; --paper-2:#F1EAD9; --paper-3:#E6DCC6;
  --moon:#E8E2D0; --tile:#5A636B; --bamboo:#8FA888; --pine:#7A9E8C;
  --lotus:#C9A8B4; --amber:#C8A468; --rust:#A8512F;
  --ink:#2C2820; --ink-2:#4A4336; --ink-3:#6B6354; --ink-4:#928873; --ink-5:#B8AC96;
  --line:rgba(44,40,32,.14); --line-2:rgba(44,40,32,.24);
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --r:2px; --r2:4px; --r3:12px;
  --ease:cubic-bezier(.4,0,.2,1);
  --serif:"Songti SC","STSong","Source Han Serif SC","Noto Serif SC",serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--paper-3)}
body{font-family:var(--serif);color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(140% 120% at 50% -20%,var(--paper),var(--paper-2) 50%,var(--paper-3))}
#app{position:relative;width:100%;height:100%;max-width:480px;overflow:hidden;background:var(--paper)}
@media(min-aspect-ratio:1/1){
  #app{width:min(432px,51vh);height:min(96vh,960px);border-radius:16px;
    box-shadow:0 0 0 1px rgba(255,255,255,.6),0 24px 72px rgba(74,67,54,.26)}
}

/* 背景层 */
#bg{position:absolute;inset:0;overflow:hidden}
#bg .ly{position:absolute;inset:-4%;background-size:cover;background-position:center;
  opacity:0;transition:opacity 1.6s var(--ease);will-change:transform,opacity}
#bg .ly.on{opacity:1}
#bg::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(247,242,230,.30),rgba(247,242,230,.06) 34%,rgba(247,242,230,.42) 82%,rgba(247,242,230,.76))}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:multiply;z-index:2;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.72' numOctaves='4'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>")}
#fx{position:absolute;inset:0;z-index:3;pointer-events:none}

/* 屏 */
.scr{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;
  padding:calc(var(--s7) + env(safe-area-inset-top)) var(--s5) calc(var(--s5) + env(safe-area-inset-bottom));
  opacity:0;pointer-events:none;transition:opacity .9s var(--ease)}
.scr.on{opacity:1;pointer-events:auto}
.scr.mid{justify-content:center;align-items:center;text-align:center}
.scr.veil{background:linear-gradient(180deg,rgba(247,242,230,.95),rgba(241,234,217,.90) 48%,rgba(230,220,198,.95))}
.scr.soft{background:linear-gradient(180deg,rgba(247,242,230,.80),rgba(247,242,230,.40) 40%,rgba(241,234,217,.86))}

.kicker{font-size:10px;letter-spacing:.5em;color:var(--ink-4);text-indent:.5em}
.h1{font-size:40px;letter-spacing:.22em;font-weight:400;line-height:1.3;margin-top:var(--s3);text-indent:.22em}
.h2{font-size:26px;letter-spacing:.2em;font-weight:400;line-height:1.4;text-indent:.2em}
.lead{font-size:13px;letter-spacing:.16em;line-height:2.2;color:var(--ink-3);margin-top:var(--s4)}
.hr{width:28px;height:1px;background:var(--line-2);margin:var(--s5) auto}
.note{font-size:11px;letter-spacing:.14em;line-height:2;color:var(--ink-4)}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;
  padding:0 var(--s6);border:1px solid var(--line-2);border-radius:var(--r);
  font-family:inherit;font-size:13px;letter-spacing:.34em;text-indent:.34em;
  color:var(--ink-2);background:rgba(255,255,255,.44);cursor:pointer;
  transition:all .4s var(--ease)}
.btn:hover{background:var(--ink-2);color:var(--paper);border-color:var(--ink-2)}
.btn:active{transform:scale(.985)}
.btn:focus-visible{outline:2px solid var(--ink-4);outline-offset:3px}
.btn.solid{background:var(--ink-2);color:var(--paper);border-color:var(--ink-2)}
.btn.solid:hover{background:var(--ink);border-color:var(--ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-4);letter-spacing:.2em}
.btn.ghost:hover{background:rgba(44,40,32,.06);color:var(--ink-2)}
.btn[disabled]{opacity:.3;pointer-events:none}

/* 生辰 */
.field-row{display:flex;gap:var(--s2);justify-content:center;margin-top:var(--s5)}
.field{position:relative}
.field label{position:absolute;top:-15px;left:50%;transform:translateX(-50%);
  font-size:9.5px;letter-spacing:.28em;color:var(--ink-4);white-space:nowrap}
.field input,.field select{width:78px;min-height:48px;padding:0 var(--s2);text-align:center;
  font-family:inherit;font-size:15px;color:var(--ink);
  background:rgba(255,255,255,.62);border:1px solid var(--line);border-radius:var(--r);
  outline:none;appearance:none;transition:.3s}
.field.wide select{width:108px}
.field input:focus,.field select:focus{border-color:var(--ink-4);background:#fff}

/* 园中三问 */
.qwrap{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%}
.qdots{display:flex;gap:6px;justify-content:center;margin-bottom:var(--s6)}
.qdot{width:5px;height:5px;border-radius:50%;background:var(--ink-5);opacity:.34;transition:.4s}
.qdot.on{opacity:1;background:var(--ink-3);transform:scale(1.3)}
.qtext{font-size:17px;letter-spacing:.1em;line-height:2;color:var(--ink);text-align:center;
  margin-bottom:var(--s6);min-height:3.4em}
.qopts{display:flex;flex-direction:column;gap:var(--s3)}
.qopt{display:flex;align-items:center;min-height:52px;padding:var(--s3) var(--s4);
  border:1px solid var(--line);border-radius:var(--r);background:rgba(255,255,255,.5);
  font-family:inherit;font-size:13.5px;letter-spacing:.1em;line-height:1.7;color:var(--ink-2);
  cursor:pointer;text-align:left;transition:all .34s var(--ease)}
.qopt:hover{background:rgba(255,255,255,.86);border-color:var(--line-2);transform:translateX(3px)}
.qopt.sel{background:var(--ink-2);color:var(--paper);border-color:var(--ink-2)}
.qopt:focus-visible{outline:2px solid var(--ink-4);outline-offset:2px}

/* 心相揭示 */
.reveal{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:var(--s5)}
.rv-zang{font-size:10.5px;letter-spacing:.4em;color:var(--ink-4);text-indent:.4em}
.rv-name{font-size:30px;letter-spacing:.2em;line-height:1.4;margin:var(--s3) 0;text-indent:.2em}
.rv-poem{font-size:13px;letter-spacing:.16em;line-height:2.1;color:var(--ink-3)}
.rv-cure{font-size:15px;letter-spacing:.12em;line-height:2.1;color:var(--ink);
  margin-top:var(--s5);padding-left:var(--s3);border-left:2px solid var(--rust)}

/* 一式 */
.rite{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.rite-name{font-size:20px;letter-spacing:.34em;text-indent:.34em;color:var(--ink)}
.rite-tip{font-size:12px;letter-spacing:.16em;line-height:2;color:var(--ink-3);margin-top:var(--s3)}
.breath-ring{position:relative;width:180px;height:180px;margin:var(--s6) 0}
.breath-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.breath-core{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.breath-ph{font-size:19px;letter-spacing:.34em;text-indent:.34em;color:var(--ink)}
.breath-n{font-size:40px;letter-spacing:.06em;color:var(--ink-3);margin-top:var(--s1);
  font-variant-numeric:tabular-nums}
.rite-meter{width:180px;height:1px;background:var(--line);margin-top:var(--s5);overflow:hidden}
.rite-meter i{display:block;height:100%;width:0;background:var(--ink-3);transition:width .4s var(--ease)}
.rite-count{font-size:10.5px;letter-spacing:.26em;color:var(--ink-4);margin-top:var(--s3)}

/* 落印 */
.seal-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.seal-mark{width:58px;height:58px;border:1.5px solid rgba(168,81,47,.76);border-radius:var(--r);
  display:flex;align-items:center;justify-content:center;color:var(--rust);
  font-size:15px;line-height:1.16;letter-spacing:.04em;margin-bottom:var(--s5)}
.seal-line{font-size:16px;letter-spacing:.14em;line-height:2.1;color:var(--ink)}
.seal-vow{margin-top:var(--s6);padding:var(--s4);width:100%;
  border:1px solid var(--line);border-radius:var(--r);background:rgba(255,255,255,.52)}
.seal-vow .t{font-size:9.5px;letter-spacing:.34em;color:var(--ink-4);margin-bottom:var(--s3)}
.seal-vow .b{font-size:13px;letter-spacing:.08em;line-height:1.95;color:var(--ink-2);text-align:left}
.streak{font-size:10.5px;letter-spacing:.26em;color:var(--ink-4);margin-top:var(--s5)}

/* 年鉴 */
.almanac{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;width:100%}
.almanac::-webkit-scrollbar{width:0}
.alm-head{font-size:10px;letter-spacing:.44em;color:var(--ink-4);text-align:center;text-indent:.44em}
.alm-title{font-size:24px;letter-spacing:.2em;text-align:center;margin:var(--s3) 0 var(--s6);text-indent:.2em}
.card{border:1px solid var(--line);border-radius:var(--r);padding:var(--s4);
  margin-bottom:var(--s3);background:rgba(255,255,255,.56)}
.card .t{font-size:9px;letter-spacing:.34em;color:var(--ink-4);margin-bottom:var(--s3)}
.card .h{font-size:14px;letter-spacing:.12em;color:var(--ink);margin-bottom:var(--s2)}
.card .b{font-size:12.5px;letter-spacing:.05em;line-height:2.05;color:var(--ink-3)}
.card .b b{color:var(--rust);font-weight:400}
.card .b em{font-style:normal;color:var(--ink)}

.strip{display:flex;gap:3px;margin-top:var(--s3);height:44px;align-items:flex-end}
.strip i{flex:1;border-radius:1px;min-height:5px;transition:.4s}
.strip-x{display:flex;justify-content:space-between;margin-top:var(--s2);
  font-size:9px;letter-spacing:.1em;color:var(--ink-5)}

.bars{margin-top:var(--s3)}
.bar{display:flex;align-items:center;gap:var(--s2);margin-bottom:5px}
.bar u{width:14px;font-size:10.5px;text-decoration:none;color:var(--ink-3);text-align:center}
.bar s{flex:1;height:5px;text-decoration:none;background:rgba(44,40,32,.09);
  border-radius:1px;position:relative;overflow:hidden}
.bar s i{position:absolute;inset:0 auto 0 0;border-radius:1px}
.bar em{font-style:normal;font-size:9px;color:var(--ink-5);width:46px;text-align:right}

.tally{display:flex;gap:var(--s2);margin-top:var(--s3)}
.tally div{flex:1;text-align:center;padding:var(--s3) 2px;border:1px solid var(--line);
  border-radius:var(--r);background:rgba(255,255,255,.44)}
.tally div i{display:block;font-style:normal;font-size:8.5px;letter-spacing:.2em;
  color:var(--ink-4);margin-bottom:var(--s1)}
.tally div b{font-size:15px;font-weight:400;color:var(--ink)}

.locked{text-align:center;padding:var(--s6) var(--s4);border:1px dashed var(--line-2);
  border-radius:var(--r);background:rgba(255,255,255,.3)}
.locked .n{font-size:30px;color:var(--ink-4);font-variant-numeric:tabular-nums}
.locked .d{font-size:11.5px;letter-spacing:.18em;line-height:2;color:var(--ink-4);margin-top:var(--s2)}

.foot{text-align:center;font-size:9.5px;letter-spacing:.22em;line-height:2.2;
  color:var(--ink-5);margin-top:var(--s5)}
.bottom{display:flex;gap:var(--s2);margin-top:var(--s4);flex-shrink:0}
.bottom .btn{flex:1;padding:0 var(--s3);font-size:12px;letter-spacing:.2em;text-indent:.2em}

#veil{position:absolute;inset:0;background:var(--paper);z-index:20;pointer-events:none;
  opacity:0;transition:opacity .82s var(--ease)}
#veil.on{opacity:1}
#toast{position:absolute;left:50%;bottom:var(--s7);transform:translate(-50%,10px);z-index:30;
  padding:var(--s3) var(--s5);background:rgba(44,40,32,.92);color:var(--paper);
  font-size:12px;letter-spacing:.14em;border-radius:var(--r);opacity:0;
  transition:.5s var(--ease);pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="stage"><div id="app">
  <div id="bg"></div>
  <canvas id="fx"></canvas>
  <div id="grain"></div>

  <!-- 0 入园 -->
  <section class="scr veil mid on" id="s-gate">
    <div class="kicker">借 景 明 心</div>
    <h1 class="h1">心园</h1>
    <div class="hr"></div>
    <p class="lead">生辰定气局　情志归五脏<br>一日一园　以观心之四季</p>
    <div style="height:var(--s7)"></div>
    <button class="btn solid" id="b-gate">入　园</button>
    <p class="note" style="margin-top:var(--s5)">情绪数据仅存于此设备</p>
  </section>

  <!-- 1 命局 -->
  <section class="scr veil mid" id="s-natal">
    <div class="kicker">其 一 · 先 天 气 局</div>
    <h2 class="h2" style="margin-top:var(--s4)">报上生辰</h2>
    <p class="lead">五行有偏，故园有荒芜处<br>此局一次既定，终身不改</p>
    <div class="field-row">
      <div class="field"><label>年</label><input id="f-y" type="number" value="1996" min="1901" max="2026" inputmode="numeric"></div>
      <div class="field"><label>月</label><input id="f-m" type="number" value="4" min="1" max="12" inputmode="numeric"></div>
      <div class="field"><label>日</label><input id="f-d" type="number" value="12" min="1" max="31" inputmode="numeric"></div>
    </div>
    <div class="field-row" style="margin-top:var(--s5)">
      <div class="field wide"><label>时 辰</label><select id="f-h"></select></div>
    </div>
    <div style="height:var(--s6)"></div>
    <button class="btn solid" id="b-natal">起　园</button>
  </section>

  <!-- 2 园中三问 -->
  <section class="scr soft" id="s-ask">
    <div class="kicker" style="text-align:center">其 二 · 园 中 三 问</div>
    <div class="qwrap">
      <div class="qdots" id="q-dots"></div>
      <p class="qtext" id="q-text"></p>
      <div class="qopts" id="q-opts"></div>
    </div>
  </section>

  <!-- 3 心相 -->
  <section class="scr soft" id="s-reveal">
    <div class="reveal">
      <div class="rv-zang" id="rv-zang"></div>
      <h2 class="rv-name" id="rv-name"></h2>
      <p class="rv-poem" id="rv-poem"></p>
      <p class="rv-cure" id="rv-cure"></p>
      <div class="bottom"><button class="btn solid" id="b-reveal" style="flex:1">行　一　式</button></div>
    </div>
  </section>

  <!-- 4 一式 -->
  <section class="scr soft" id="s-rite">
    <div class="rite">
      <div class="rite-name" id="rite-name"></div>
      <p class="rite-tip" id="rite-tip"></p>
      <div class="breath-ring" id="rite-ring">
        <svg viewBox="0 0 180 180">
          <circle cx="90" cy="90" r="82" fill="none" stroke="rgba(44,40,32,.10)" stroke-width="1.5"/>
          <circle cx="90" cy="90" r="82" fill="none" stroke="#6B6354" stroke-width="1.5"
            stroke-linecap="round" id="rite-arc" stroke-dasharray="515" stroke-dashoffset="515"/>
        </svg>
        <div class="breath-core">
          <div class="breath-ph" id="rite-ph"></div>
          <div class="breath-n" id="rite-n"></div>
        </div>
      </div>
      <div class="rite-meter"><i id="rite-bar"></i></div>
      <div class="rite-count" id="rite-count"></div>
    </div>
  </section>

  <!-- 5 落印 -->
  <section class="scr soft" id="s-seal">
    <div class="seal-wrap">
      <div class="seal-mark">心园<br>留念</div>
      <p class="seal-line" id="seal-line"></p>
      <div class="seal-vow">
        <div class="t">今 日 之 约</div>
        <div class="b" id="seal-vow"></div>
      </div>
      <p class="streak" id="seal-streak"></p>
    </div>
    <div class="bottom">
      <button class="btn" id="b-almanac">年　鉴</button>
      <button class="btn solid" id="b-done">收　园</button>
    </div>
  </section>

  <!-- 6 年鉴 -->
  <section class="scr veil" id="s-almanac">
    <div class="almanac" id="alm-body"></div>
    <div class="bottom">
      <button class="btn ghost" id="b-reset">重设生辰</button>
      <button class="btn" id="b-back">返　回</button>
    </div>
  </section>

  <div id="veil"></div>
  <div id="toast"></div>
</div></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+(b-a)*Math.random();
const pad2=n=>String(n).padStart(2,'0');
const todayKey=()=>{const d=new Date();return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;};

/* ═══ 五志归脏 ═══ */
const ZANG={
  木:{z:'肝',zhi:'怒',fn:'主疏泄，司谋断',sym:'胁胀、急躁、难入眠'},
  火:{z:'心',zhi:'喜',fn:'主神明，司喜乐',sym:'心悸、多梦、亢后疲'},
  土:{z:'脾',zhi:'思',fn:'主运化，司思虑',sym:'纳差、腹胀、念头黏'},
  金:{z:'肺',zhi:'悲',fn:'主气，司治节',sym:'气短、胸闷、欲叹息'},
  水:{z:'肾',zhi:'恐',fn:'主藏精，司恐志',sym:'腰软、夜惊、怯而退'}
};
const SHENG={木:'火',火:'土',土:'金',金:'水',水:'木'};
const MOTHER={火:'木',土:'火',金:'土',水:'金',木:'水'};
const KE={木:'土',土:'水',水:'火',火:'金',金:'木'};
const EL_C={木:'#8FA888',火:'#C08A8A',土:'#C8A468',金:'#A8AEB4',水:'#8AA6B8'};
const EL_HUE={木:'竹青',火:'朱赤',土:'秋香',金:'月白',水:'天青'};
const EL_ACT={
  木:'晨起面东站三分钟，让视线落在远处的绿上；案头添一株文竹。',
  火:'日落前晒十分钟太阳；点一支果木香，让暖意留在房间里。',
  土:'今日吃一顿热的、软的、慢的；手机放远，专心咀嚼。',
  金:'清空桌面一角，只留一物；做十次深长呼吸，呼比吸长。',
  水:'睡前温水泡脚十分钟；东北角置一碗清水。'
};

/* ═══ 八相 ═══ */
const XIANG=[
{k:'anx',n:'漏窗 · 囚澜',pole:'阴',emo:'焦虑',el:'水',
 poem:'隔墙花影动，疑是玉人来',
 cure:'你的焦虑是真实的，不需要假装它不存在。',
 mech:'边界化 Containment',

const GAN=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];

function natal(y,m,d,h){
  let yy=(m<2||(m===2&&d<4))?y-1:y;
  const ys=((yy-4)%10+10)%10, yz=((yy-4)%12+12)%12;
  const cut=[0,6,4,6,5,6,6,7,8,8,8,7,7];
  let mo=(d<cut[m])?m-1:m; if(mo<1)mo=12;
  const mi=(mo-2+12)%12, head=[2,4,6,8,0][ys%5];
  const ms=(head+mi)%10, mz=(mi+2)%12;
  const days=Math.floor((Date.UTC(y,m-1,d)-Date.UTC(2000,0,1))/864e5);
  const ds=((4+days)%10+10)%10, dz=((6+days)%12+12)%12;
  const hz=Math.floor(((h+1)%24)/2), hs=(ds*2+hz)%10;
  const cnt={木:0,火:0,土:0,金:0,水:0};
  const gw=[1,1.2,1.6,1], zw=[1,1.6,1.2,1];
  [ys,ms,ds,hs].forEach((i,k)=>cnt[GEL[i]]+=gw[k]);
  [yz,mz,dz,hz].forEach((i,k)=>cnt[ZEL[i]]+=zw[k]);
  const ord=Object.keys(cnt).sort((a,b)=>cnt[a]-cnt[b]);
  return{pillars:[GAN[ys]+ZHI[yz],GAN[ms]+ZHI[mz],GAN[ds]+ZHI[dz],GAN[hs]+ZHI[hz]],
    cnt,weak:ord[0],weak2:ord[1],strong:ord[4],dayGan:GAN[ds],dayEl:GEL[ds],
    birth:{y,m,d,h}};
}
function judge(nt,x){

      fix:`盛则泄其子：顺<b>${SHENG[el]}</b>而泄，借<b>${kx}</b>而制。取${EL_HUE[SHENG[el]]}之色，把多出来的劲导出去。`};

    fix:`平则守中：不必大动。若要调，先补命中最弱的<b>${nt.weak}</b>——那才是长年欠的账。`};
}
function pickXiang(pad){

    else if(A>0) pool=['joy','hope'];
    else if(D>0) pool=['firm','calm'];

  }

function solarTerm(){
  const d=new Date(), m=d.getMonth()+1, dd=d.getDate();
  let best=null,bestGap=999;
  JQ.forEach(([jm,jd,jn])=>{
    if(jm===m&&dd>=jd){const g=dd-jd; if(g<bestGap){bestGap=g;best=jn;}}
  });
  if(!best){
    const pm=m===1?12:m-1;
    const cands=JQ.filter(j=>j[0]===pm);
    best=cands.length?cands[cands.length-1][2]:'节气之交';
  }
  return best;
}

const FX={parts:[],mode:null,ctx:null,dpr:1,t:0,dropCb:null,drops:0};
(function(){
  const c=$('#fx');
  FX.ctx=c.getContext('2d');
  FX.fit=()=>{
    const r=$('#app').getBoundingClientRect();
    FX.dpr=Math.min(devicePixelRatio,2);
    c.width=r.width*FX.dpr; c.height=r.height*FX.dpr;
    FX.w=r.width; FX.h=r.height;
  };
  FX.fit(); addEventListener('resize',FX.fit);
  FX.set=(mode)=>{
    FX.mode=mode; FX.parts=[]; FX.drops=0;
    if(mode==='rain'){
      for(let i=0;i<90;i++)FX.parts.push({x:rnd(0,FX.w),y:rnd(-FX.h,FX.h),
        v:rnd(3.2,6.4),l:rnd(9,22),o:rnd(.14,.34)});
    }else if(mode==='dust'){
      for(let i=0;i<46;i++)FX.parts.push({x:rnd(0,FX.w),y:rnd(0,FX.h),
        r:rnd(.8,2.2),v:rnd(.12,.42),ph:rnd(0,6.28),o:rnd(.2,.5)});
    }else if(mode==='petal'){
      for(let i=0;i<26;i++)FX.parts.push({x:rnd(0,FX.w),y:rnd(-FX.h,0),
        r:rnd(2.4,5),v:rnd(.7,1.8),sw:rnd(.6,1.9),ph:rnd(0,6.28),o:rnd(.3,.66)});
    }
  };
  (function draw(){
    requestAnimationFrame(draw);
    const x=FX.ctx; if(!x)return;
    FX.t+=.016;
    x.setTransform(FX.dpr,0,0,FX.dpr,0,0);
    x.clearRect(0,0,FX.w,FX.h);
    if(FX.mode==='rain'){
      x.strokeStyle='rgba(120,134,148,1)'; x.lineWidth=1;
      FX.parts.forEach(p=>{
        x.globalAlpha=p.o;
        x.beginPath(); x.moveTo(p.x,p.y); x.lineTo(p.x-1.2,p.y+p.l); x.stroke();
        p.y+=p.v;
        if(p.y>FX.h){
          p.y=rnd(-60,-10); p.x=rnd(0,FX.w);
          if(FX.dropCb) FX.dropCb();
        }
      });
    }else if(FX.mode==='dust'){
      FX.parts.forEach(p=>{
        x.globalAlpha=p.o*(.5+.5*Math.sin(FX.t*.7+p.ph));
        x.fillStyle='rgba(255,238,198,1)';
        x.beginPath(); x.arc(p.x,p.y,p.r,0,6.2832); x.fill();
        p.y-=p.v; p.x+=Math.sin(FX.t*.4+p.ph)*.22;
        if(p.y<-8){p.y=FX.h+8;p.x=rnd(0,FX.w);}
      });
    }else if(FX.mode==='petal'){
      FX.parts.forEach(p=>{
        x.globalAlpha=p.o;
        x.fillStyle='rgba(226,176,190,1)';
        x.save(); x.translate(p.x,p.y); x.rotate(Math.sin(FX.t+p.ph)*.9);
        x.beginPath(); x.ellipse(0,0,p.r,p.r*.56,0,0,6.2832); x.fill();
        x.restore();
        p.y+=p.v; p.x+=Math.sin(FX.t*.7+p.ph)*p.sw;
        if(p.y>FX.h+10){p.y=rnd(-40,-10);p.x=rnd(0,FX.w);}
      });
    }
    x.globalAlpha=1;
  })();
})();

/* ═══ 音（极简，仅界面反馈） ═══ */
let AC=null;
function tone(f,dur,vol,type){
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime;
    const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();
    o.type=type||'sine'; o.frequency.value=f;
    fl.type='lowpass'; fl.frequency.value=1400;
    o.connect(fl); fl.connect(g); g.connect(AC.destination);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.start(t); o.stop(t+dur);
  }catch(e){}
}

  setTimeout(()=>t.classList.remove('on'),2200);
}

    '未 13-15','申 15-17','酉 17-19','戌 19-21','亥 21-23'];

/* ═══ 流程 ═══ */
$('#b-gate').onclick=()=>{
  SND.tap();
  if(S.natal){
    const t=todayKey();
    const done=S.days.find(d=>d.date===t);
    if(done){ renderAlmanac(); fade(()=>go('#s-almanac')); toast('今日已入园，明日再来'); return; }
    startAsk();
  }else{
    go('#s-natal');
  }
};

$('#b-natal').onclick=()=>{
  const y=+$('#f-y').value,m=+$('#f-m').value,d=+$('#f-d').value,h=+$('#f-h').value;
  if(!(y>=1901&&y<=2026)||!(m>=1&&m<=12)||!(d>=1&&d<=31)){toast('生辰不合，请再看一眼');return;}
  S.natal=natal(y,m,d,h); DB.save(S); SND.ok();
  const nt=S.natal;
  toast(`${nt.pillars.join(' ')}　${nt.strong}盛而${nt.weak}薄`);
  setTimeout(startAsk,900);
};

function startAsk(){
  ST.askIdx=0; ST.pad={P:0,A:0,D:0};
  setBg('calm'); FX.set('dust');
  fade(()=>{go('#s-ask'); renderAsk();});
}
function renderAsk(){
  const i=ST.askIdx, a=ASKS[i];
  $('#q-dots').innerHTML=ASKS.map((_,n)=>`<div class="qdot${n<=i?' on':''}"></div>`).join('');
  $('#q-text').textContent=a.q;
  $('#q-opts').innerHTML=a.opts.map(o=>
    `<button class="qopt" data-v="${o.v}">${o.l}</button>`).join('');
  $$('.qopt').forEach(b=>{
    b.onclick=()=>{
      $$('.qopt').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel'); SND.tap();
      ST.pad[a.dim]=+b.dataset.v;
      setTimeout(()=>{
        ST.askIdx++;
        if(ST.askIdx>=ASKS.length) doReveal();
        else renderAsk();
      },340);
    };
  });
}

function doReveal(){
  ST.x=pickXiang(ST.pad);
  ST.jd=judge(S.natal,ST.x);
  const x=ST.x;
  setBg(x.k);
  FX.set(x.k==='sad'?'rain':x.k==='ang'?'petal':x.k==='hope'?'petal':'dust');
  $('#rv-zang').textContent=`${x.el} · 入${ZANG[x.el].z} · ${ZANG[x.el].zhi}伤${ZANG[x.el].z}`;
  $('#rv-name').textContent=x.n;
  $('#rv-poem').textContent=x.poem;
  $('#rv-cure').textContent=x.cure;
  SND.ok();
  fade(()=>go('#s-reveal'));
}

$('#b-reveal').onclick=()=>{SND.tap();startRite();};

/* ═══ 一式 ═══ */
let riteTimer=null;
function startRite(){
  const r=ST.x.rite;
  ST.riteOk=false;
  $('#rite-name').textContent=r.t;
  $('#rite-tip').textContent=r.tip;
  $('#rite-bar').style.width='0%';
  $('#rite-count').textContent='';
  $('#rite-ph').textContent='';
  $('#rite-n').textContent='';
  $('#rite-arc').style.strokeDashoffset='515';
  $('#rite-ring').style.display=(r.kind==='breath')?'block':'none';
  go('#s-rite');
  clearInterval(riteTimer); FX.dropCb=null;
  if(r.kind==='breath') riteBreath(r);
  else if(r.kind==='wait') riteWait(r);
  else riteTouch(r);
}
function riteDone(){
  ST.riteOk=true; SND.seal();
  clearInterval(riteTimer); FX.dropCb=null;
  $('#rite-ring').style.pointerEvents='none';
  setTimeout(doSeal,760);
}
function riteBreath(r){
  const CY=19, t0=performance.now()/1000;
  let cyc=0,last='';
  riteTimer=setInterval(()=>{
    const e=((performance.now()/1000)-t0)%CY;
    const c=Math.floor(((performance.now()/1000)-t0)/CY);
    let ph,n,prog;
    if(e<4){ph='吸　气';n=Math.ceil(4-e);prog=e/4;}
    else if(e<11){ph='屏　息';n=Math.ceil(11-e);prog=1;}
    else{ph='呼　气';n=Math.ceil(19-e);prog=1-(e-11)/8;}
    $('#rite-ph').textContent=ph;
    $('#rite-n').textContent=n;
    $('#rite-arc').style.strokeDashoffset=515*(1-prog);
    if(ph!==last){last=ph;tone(ph==='吸　气'?392:ph==='呼　气'?261.6:329.6,1.1,.032);}
    if(c>cyc){cyc=c;}
    $('#rite-bar').style.width=clamp(cyc/r.need,0,1)*100+'%';
    $('#rite-count').textContent=`第 ${Math.min(cyc+1,r.need)} ／ ${r.need} 息`;
    if(cyc>=r.need) riteDone();
  },100);
}
function riteWait(r){
  let n=0;
  FX.dropCb=()=>{
    n++;
    if(n%3===0) SND.drop();
    $('#rite-bar').style.width=clamp(n/r.need,0,1)*100+'%';
    $('#rite-count').textContent=`已落 ${Math.min(n,r.need)} ／ ${r.need} 滴`;
    if(n>=r.need){FX.dropCb=null;riteDone();}
  };
  $('#rite-count').textContent=`已落 0 ／ ${r.need} 滴`;
}
function riteTouch(r){
  let n=0;
  const scr=$('#s-rite');
  $('#rite-count').textContent=`0 ／ ${r.need}`;
  const onHit=e=>{
    if(e.target.closest('.btn'))return;
    n++; SND.tap();
    // 触点涟漪
    const rect=scr.getBoundingClientRect();
    const d=document.createElement('div');
    d.style.cssText=`position:absolute;left:${e.clientX-rect.left}px;top:${e.clientY-rect.top}px;
      width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;pointer-events:none;
      border:1px solid rgba(44,40,32,.4);animation:rp .7s ease-out forwards;z-index:9`;
    scr.appendChild(d); setTimeout(()=>d.remove(),720);
    $('#rite-bar').style.width=clamp(n/r.need,0,1)*100+'%';
    $('#rite-count').textContent=`${Math.min(n,r.need)} ／ ${r.need}`;
    if(n>=r.need){scr.removeEventListener('pointerdown',onHit);riteDone();}
  };
  scr.addEventListener('pointerdown',onHit);
}

/* ═══ 落印 ═══ */
function doSeal(){
  const x=ST.x, jd=ST.jd, t=todayKey();
  if(!S.days.find(d=>d.date===t)){
    S.days.push({date:t,k:x.k,el:x.el,pad:{...ST.pad},term:solarTerm()});
    if(S.days.length>400) S.days=S.days.slice(-400);
    DB.save(S);
  }
  $('#seal-line').textContent=x.cure;
  $('#seal-vow').innerHTML=x.vow;
  const st=streak();
  $('#seal-streak').textContent=st>1?`连来第 ${st} 日　共 ${S.days.length} 园`:`共 ${S.days.length} 园`;
  FX.set('dust');
  fade(()=>go('#s-seal'));
}
function streak(){
  if(!S.days.length)return 0;
  const set=new Set(S.days.map(d=>d.date));
  let n=0; const d=new Date();
  for(;;){
    const k=`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
    if(set.has(k)){n++;d.setDate(d.getDate()-1);}else break;
  }
  return n;
}

$('#b-done').onclick=()=>{
  SND.tap();
  fade(()=>{go('#s-gate');setBg('calm');FX.set('dust');});
};
$('#b-almanac').onclick=()=>{SND.tap();renderAlmanac();fade(()=>go('#s-almanac'));};
$('#b-back').onclick=()=>{
  SND.tap();
  const t=todayKey();
  fade(()=>{go(S.days.find(d=>d.date===t)?'#s-gate':'#s-gate');setBg('calm');FX.set('dust');});
};
$('#b-reset').onclick=()=>{
  if(!confirm('重设生辰会清空全部园记，确定？'))return;
  DB.wipe(); S=DB.init();
  fade(()=>{go('#s-gate');setBg('calm');});
  toast('已清空，可重新起园');
};

/* ═══ 年鉴 ═══ */
function renderAlmanac(){
  const n=S.days.length, nt=S.natal;
  const tot=nt?Object.values(nt.cnt).reduce((a,b)=>a+b,0):1;
  const last=S.days[S.days.length-1];
  const lx=last?BYK[last.k]:null;
  let html=`<div class="alm-head">心 园 年 鉴</div>
    <div class="alm-title">${solarTerm()}</div>`;

  // 今日
  if(lx&&last.date===todayKey()){
    const jd=judge(nt,lx);
    html+=`<div class="card">
      <div class="t">今 日 心 相</div>
      <div class="h">${lx.n}　·　${lx.emo}</div>
      <div class="b">${lx.el}属入<b>${ZANG[lx.el].z}</b>，${ZANG[lx.el].fn}，其志为<b>${ZANG[lx.el].zhi}</b>。<br><br>${lx.read}</div>
    </div>
    <div class="card">
      <div class="t">其 二 · 命 局 相 参</div>
      <div class="h">${jd.head}　·　${jd.type}</div>
      <div class="b">${jd.body}<br><br><b>调法：</b>${jd.fix}</div>
      <div class="bars">${['木','火','土','金','水'].map(e=>{
        const pc=nt.cnt[e]/tot;
        return `<div class="bar"><u>${e}</u><s><i style="width:${Math.min(100,pc*300).toFixed(0)}%;background:${EL_C[e]};opacity:${e===lx.el?1:.42}"></i></s><em>${ZANG[e].z}·${ZANG[e].zhi}</em></div>`;
      }).join('')}</div>
      <div class="b" style="margin-top:var(--s3);font-size:11px;color:var(--ink-5)">
        ${nt.pillars.join('　')}　日主${nt.dayGan}（${nt.dayEl}）</div>
    </div>
    <div class="card">
      <div class="t">其 三 · 冰 山 之 下</div>
      <div class="h">你真正要的，不在表层</div>
      <div class="b">${lx.berg}</div>
    </div>
    <div class="card">
      <div class="t">其 四 · 今 日 三 件 事</div>
      <div class="h">${lx.mech}</div>
      <div class="b"><b>认知　</b>${lx.cbt}<br><br><b>行为　</b>${lx.vow}<br><br><b>养气　</b>取<b>${EL_HUE[jd.fixEl]}</b>之色。${EL_ACT[jd.fixEl]}</div>
    </div>`;
  }

  // 长卷（满3日）
  if(n>=3){
    const recent=S.days.slice(-30);
    html+=`<div class="card">
      <div class="t">其 五 · 心 相 长 卷</div>
      <div class="h">近 ${recent.length} 日</div>
      <div class="strip">${recent.map(d=>{
        const xx=BYK[d.k], hv=(d.pad.P+2)/5;
        return `<i style="background:${EL_C[xx.el]};height:${20+hv*24}px;opacity:${.5+hv*.5}" title="${d.date} ${xx.emo}"></i>`;
      }).join('')}</div>
      <div class="strip-x"><span>${recent[0].date.slice(5)}</span><span>${recent[recent.length-1].date.slice(5)}</span></div>
    </div>`;
  }else{
    html+=`<div class="locked">
      <div class="n">${3-n}</div>
      <div class="d">再来 ${3-n} 日<br>可见心相长卷</div>
    </div>`;
  }

  // 规律（满7日）
  if(n>=7){
    const cnt={};
    S.days.forEach(d=>cnt[d.k]=(cnt[d.k]||0)+1);
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
    const yin=S.days.filter(d=>BYK[d.k].pole==='阴').length;
    const avgP=(S.days.reduce((a,d)=>a+d.pad.P,0)/n).toFixed(1);
    // 星期分布
    const wd=[0,0,0,0,0,0,0], wc=[0,0,0,0,0,0,0];
    S.days.forEach(d=>{
      const w=new Date(d.date).getDay();
      wd[w]+=d.pad.P; wc[w]++;
    });
    let lowW=-1,lowV=99;
    wd.forEach((v,i)=>{if(wc[i]>=2){const av=v/wc[i];if(av<lowV){lowV=av;lowW=i;}}});
    const WN=['周日','周一','周二','周三','周四','周五','周六'];
    html+=`<div class="card">
      <div class="t">其 六 · 规 律 发 现</div>
      <div class="h">${n} 日之中</div>
      <div class="tally">
        <div><i>最 常 心 相</i><b>${BYK[top[0]].emo}</b></div>
        <div><i>阴 相 占 比</i><b>${Math.round(yin/n*100)}%</b></div>
        <div><i>均 值</i><b>${avgP>0?'+':''}${avgP}</b></div>
      </div>
      <div class="b" style="margin-top:var(--s4)">
        ${lowW>=0?`数据显示，<b>${WN[lowW]}</b>是你情绪的低位。若这不是偶然，它值得被安排——把重要的事避开这一天，或在这天给自己多留一点余地。`:'尚未看出明显的周内规律，继续记录。'}
        ${yin/n>.7?'<br><br>近来阴相偏多。这不是评判——但如果这种状态持续超过两周，请考虑寻求专业帮助。':''}
      </div>
    </div>`;
  }else{
    html+=`<div class="locked">
      <div class="n">${7-n}</div>
      <div class="d">再来 ${7-n} 日<br>可见情绪规律<br><span style="font-size:10px;color:var(--ink-5)">少于七日谈规律，是不诚实的</span></div>
    </div>`;
  }

  html+=`<div class="foot">
    园 无 死 局 　 移 步 自 成 景<br>
    本页为心理自助与美学体验，不作医疗诊断<br>
    数据仅存于此设备，清除浏览器数据即消失
  </div>`;
  $('#alm-body').innerHTML=html;
  $('#alm-body').scrollTop=0;
}

}
