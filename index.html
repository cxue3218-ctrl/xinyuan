<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>借景明心 · 八相心园</title>
<style>
:root{
  --c0:#fdfaf3;--c1:#f5f0e4;--c2:#ede5d2;--c3:#d9cfbb;--c4:#b8ac96;--c5:#8c7f68;
  --c6:#5e5444;--c7:#3a3228;--c8:#221e17;
  --ink:#2c2820;--paper:#f7f2e6;
  --s-moon:#e8e2d0;--s-lotus:#d4bbc4;--s-bamboo:#8fa888;--s-tile:#5a636b;--s-pine:#7a9e8c;
  --r2:2px;--r4:4px;--sp4:4px;--sp8:8px;--sp12:12px;--sp16:16px;--sp24:24px;--sp32:32px;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--c2)}
body{font-family:"Songti SC","STSong","Source Han Serif SC","Noto Serif SC",serif;color:var(--ink)}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(130% 110% at 50% -10%,var(--c1),var(--c2) 55%,var(--c3))}
#frame{position:relative;width:100%;height:100%;max-width:480px;overflow:hidden;background:var(--paper)}
@media(min-aspect-ratio:1/1){
  #frame{width:min(440px,52vh);height:min(95vh,950px);border-radius:18px;
    box-shadow:0 0 0 1px rgba(255,255,255,.55),0 28px 80px rgba(58,50,40,.28)}}
canvas#gl,canvas#fogc{position:absolute;inset:0;width:100%;height:100%;display:block}
canvas#fogc{touch-action:none;pointer-events:none}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.09;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
#vign{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%,rgba(253,250,243,0) 38%,rgba(180,165,140,.10) 76%,rgba(140,124,96,.24) 100%)}

/* ── 层 ── */
.layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:var(--sp32) var(--sp24);opacity:0;pointer-events:none;transition:opacity .95s var(--ease)}
.layer.on{opacity:1;pointer-events:auto}
.layer.paper{background:linear-gradient(180deg,rgba(253,250,243,.96),rgba(247,242,230,.93) 52%,rgba(240,233,218,.96))}
.layer.shift{justify-content:flex-start;padding-top:52px}

.seal{font-size:10px;letter-spacing:.46em;color:var(--c4)}
h1{font-size:38px;letter-spacing:.2em;font-weight:400;line-height:1.32;margin:13px 0 0;color:var(--c7)}
.sub{margin-top:13px;font-size:12px;letter-spacing:.19em;color:var(--c5);line-height:2.18;text-align:center}
.rule{width:30px;height:1px;background:linear-gradient(90deg,transparent,var(--c4),transparent);margin:var(--sp24) 0}
.btn{margin-top:6px;padding:12px 38px;border:1px solid rgba(92,80,64,.36);border-radius:var(--r2);
  font-size:13px;letter-spacing:.34em;color:var(--c6);background:rgba(255,255,255,.38);
  cursor:pointer;transition:.4s var(--ease);font-family:inherit;min-height:44px}
.btn:hover{background:var(--c6);color:var(--c0);border-color:var(--c6);letter-spacing:.42em}
.btn:focus-visible{outline:2px solid var(--c5);outline-offset:3px}
.btn.dim{opacity:.28;pointer-events:none}

/* ── 生辰 ── */
.birth{display:flex;gap:var(--sp8);margin:4px 0 var(--sp24)}
.fld{position:relative}
.fld input,.fld select{width:75px;padding:11px 8px;text-align:center;background:rgba(255,255,255,.6);
  border:1px solid rgba(92,80,64,.24);border-radius:var(--r2);color:var(--ink);font-size:14px;
  font-family:inherit;outline:none;appearance:none;min-height:44px}
.fld.w select{width:104px}
.fld input:focus,.fld select:focus{border-color:var(--c5);background:#fff}
.fld label{position:absolute;top:-14px;left:50%;transform:translateX(-50%);
  font-size:9.5px;letter-spacing:.26em;color:var(--c4)}

/* ── PAD 问卷 ── */
#quiz{width:100%;max-width:340px}
.q-item{margin-bottom:var(--sp24)}
.q-text{font-size:13px;letter-spacing:.1em;color:var(--c7);margin-bottom:var(--sp12);line-height:1.9}
.q-opts{display:flex;gap:var(--sp8);flex-wrap:wrap;justify-content:center}
.q-opt{padding:9px 14px;border:1px solid rgba(92,80,64,.26);border-radius:var(--r2);
  font-size:12px;letter-spacing:.1em;color:var(--c5);background:rgba(255,255,255,.42);
  cursor:pointer;transition:.32s;min-height:44px;display:flex;align-items:center}
.q-opt:hover{background:rgba(92,80,64,.12)}
.q-opt.sel{background:var(--c6);color:var(--c0);border-color:var(--c6)}
.q-opt:focus-visible{outline:2px solid var(--c5);outline-offset:2px}
.q-prog{display:flex;gap:5px;justify-content:center;margin-bottom:var(--sp24)}
.q-dot{width:6px;height:6px;border-radius:50%;background:var(--c3);transition:.3s}
.q-dot.on{background:var(--c5)}

/* ── 泼墨 ── */
#inkwrap{position:relative;width:192px;height:192px;margin:8px 0 6px}
#inkc{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;
  box-shadow:inset 0 0 32px rgba(92,80,64,.22),0 0 0 1px rgba(92,80,64,.22),0 12px 36px rgba(58,50,40,.16)}
#inkhint{font-size:10px;letter-spacing:.2em;color:var(--c5);margin-bottom:var(--sp12);height:1.6em;text-align:center}
.hues{display:flex;flex-wrap:wrap;gap:var(--sp16) 13px;justify-content:center;max-width:310px;margin-bottom:var(--sp16)}
.hue{width:38px;height:38px;border-radius:50%;cursor:pointer;position:relative;
  box-shadow:0 0 0 1px rgba(255,255,255,.7),0 4px 12px rgba(58,50,40,.22);transition:.36s}
.hue:hover{transform:translateY(-4px) scale(1.08)}
.hue:focus-visible{outline:2px solid var(--c5);outline-offset:3px}
.hue.sel{box-shadow:0 0 0 1px #fff,0 0 0 3.5px rgba(58,50,40,.66),0 6px 16px rgba(58,50,40,.28);
  transform:translateY(-3px) scale(1.05)}
.hue span{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);
  font-size:9px;letter-spacing:.1em;color:var(--c4);white-space:nowrap}
.hue u{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:8px;
  letter-spacing:.05em;color:#a8512f;text-decoration:none;white-space:nowrap;opacity:0;transition:.3s}
.hue.sel u{opacity:1}
#deg{width:240px;margin:0 0 var(--sp16);opacity:0;transition:.55s;pointer-events:none}
#deg.on{opacity:1;pointer-events:auto}
#deg label{display:block;font-size:10px;letter-spacing:.26em;color:var(--c4);text-align:center;margin-bottom:var(--sp8)}
#deg input[type=range]{width:100%;appearance:none;height:2px;background:linear-gradient(90deg,var(--c3),var(--c5));outline:none}
#deg input[type=range]::-webkit-slider-thumb{appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--c0);border:1px solid var(--c5);box-shadow:0 2px 6px rgba(58,50,40,.24);cursor:pointer}
#degv{text-align:center;font-size:11px;letter-spacing:.2em;color:var(--c5);margin-top:var(--sp8)}

/* ── 水墨侧影女子 ── */
#silhouette{position:absolute;right:-2%;bottom:0;width:48%;height:64%;pointer-events:none;
  opacity:0;transition:opacity 1.6s var(--ease),transform 1.6s var(--ease);transform:translateX(12px);z-index:4}
#silhouette.on{opacity:1;transform:translateX(0)}
#silhouette svg{position:absolute;bottom:0;right:0;height:100%;width:auto;
  filter:drop-shadow(0 8px 24px rgba(58,50,40,.18))}

/* ── 对话气泡 ── */
.say{position:absolute;left:var(--sp16);right:var(--sp16);z-index:6;
  padding:var(--sp16) var(--sp16);background:rgba(253,250,243,.94);
  border:1px solid rgba(120,104,80,.2);border-radius:var(--r4);
  box-shadow:0 8px 28px rgba(58,50,40,.12);
  opacity:0;transform:translateY(8px);transition:.65s var(--ease);pointer-events:none}
.say.on{opacity:1;transform:translateY(0)}
.say.btm{bottom:var(--sp24)}
.say.mid{bottom:42%;top:auto}
.say i{display:block;font-style:normal;font-size:9px;letter-spacing:.36em;color:#a1866a;margin-bottom:8px}
.say p{font-size:13px;line-height:2.05;letter-spacing:.08em;color:var(--c7);min-height:1.8em}
.say p b{color:#a8512f;font-weight:400}

/* ── HUD ── */
#hud{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .9s;z-index:5}
#hud.on{opacity:1}
#gname{position:absolute;top:38px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.34em;
  color:var(--c7);text-shadow:0 1px 12px rgba(253,250,243,.96)}
#gtip{position:absolute;top:68px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.26em;
  color:var(--c5);text-shadow:0 1px 8px rgba(253,250,243,.96)}
#prog{position:absolute;top:92px;left:50%;transform:translateX(-50%);width:90px;height:1px;background:rgba(92,80,64,.2)}
#prog i{display:block;height:100%;width:0;background:var(--c5);transition:width .3s}

/* ── 光斑 ── */
.spark{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;
  cursor:pointer;pointer-events:auto;z-index:5;
  background:radial-gradient(circle,rgba(255,250,220,.98),rgba(255,228,150,.3) 48%,transparent 72%);
  animation:bob 3s ease-in-out infinite}
.spark.gone{pointer-events:none;animation:pop .55s forwards}
@keyframes bob{0%,100%{transform:translate(0,0) scale(1);opacity:.78}50%{transform:translate(2px,-8px) scale(1.2);opacity:1}}
@keyframes pop{to{transform:scale(3.2);opacity:0}}

/* ── 画卷 ── */
#scrollwrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(240,234,222,.97);opacity:0;pointer-events:none;transition:opacity 1.1s;z-index:7;padding:var(--sp24)}
#scrollwrap.on{opacity:1;pointer-events:auto}
#scrollc{width:100%;border:1px solid rgba(120,104,80,.26);box-shadow:0 16px 50px rgba(58,50,40,.22)}
#scrolltip{margin-top:var(--sp12);font-size:10px;letter-spacing:.3em;color:var(--c5)}

/* ── 报告 ── */
#rep{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:8;
  padding:44px 26px 54px;opacity:0;pointer-events:none;transition:opacity 1.1s;
  background:linear-gradient(180deg,rgba(253,250,243,.97),rgba(247,242,230,.99))}
#rep.on{opacity:1;pointer-events:auto}
#rep::-webkit-scrollbar{width:0}
.stamp{width:56px;height:56px;margin:0 auto var(--sp24);border:1.5px solid rgba(168,81,47,.78);
  border-radius:var(--r2);display:flex;align-items:center;justify-content:center;
  color:#a8512f;font-size:15.5px;line-height:1.14;text-align:center;letter-spacing:.06em}
.verdict{font-size:17px;line-height:2.18;letter-spacing:.13em;text-align:center;color:var(--c7);margin-bottom:6px}
.vsrc{font-size:9.5px;letter-spacing:.24em;color:var(--c4);text-align:center;margin-bottom:var(--sp32)}
.card{border:1px solid rgba(120,104,80,.18);border-radius:var(--r2);padding:18px 17px;
  margin-bottom:13px;background:rgba(255,253,247,.78)}
.ctag{font-size:9px;letter-spacing:.34em;color:var(--c4);margin-bottom:10px}
.ctitle{font-size:14px;letter-spacing:.13em;color:var(--c7);margin-bottom:9px}
.ctxt{font-size:12.5px;line-height:2.06;letter-spacing:.05em;color:var(--c6)}
.ctxt b{color:#a8512f;font-weight:400}
.ctxt em{font-style:normal;color:var(--c7)}
.act-row{border-left:2px solid #a8512f;padding-left:12px;margin:12px 0}
.act-row p{font-size:12.5px;line-height:1.98;color:var(--c6);margin-bottom:8px}
.act-row p:last-child{margin-bottom:0}
.act-row p b{color:var(--c7);font-weight:400}
.bars{margin-top:12px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bar u{width:14px;font-size:10.5px;color:var(--c5);text-decoration:none;text-align:center}
.bar s{flex:1;height:6px;text-decoration:none;background:rgba(92,80,64,.1);border-radius:1px;position:relative}
.bar s i{position:absolute;left:0;top:0;bottom:0;border-radius:1px}
.bar em{font-style:normal;font-size:9px;color:var(--c4);width:50px;text-align:right}
.row{display:flex;gap:8px;margin-top:12px}
.chip{flex:1;text-align:center;padding:10px 3px;border:1px solid rgba(120,104,80,.16);border-radius:var(--r2);background:rgba(255,255,255,.5)}
.chip i{display:block;font-size:8.5px;letter-spacing:.2em;color:var(--c4);font-style:normal;margin-bottom:5px}
.chip b{font-size:13px;font-weight:400;letter-spacing:.06em;color:var(--c7)}
.foot{text-align:center;font-size:9.5px;letter-spacing:.24em;color:var(--c4);margin-top:var(--sp24);line-height:2.2}
.again{display:block;margin:18px auto 0;padding:11px 30px;border:1px solid rgba(92,80,64,.3);
  background:rgba(255,255,255,.5);color:var(--c6);font-family:inherit;font-size:12px;letter-spacing:.3em;
  cursor:pointer;border-radius:var(--r2);min-height:44px}
#fade{position:absolute;inset:0;background:var(--paper);pointer-events:none;opacity:0;transition:opacity .78s;z-index:9}
#fade.on{opacity:1}
</style>
</head>
<body>
<div id="stage"><div id="frame">
  <canvas id="gl"></canvas>
  <canvas id="fogc"></canvas>
  <div id="vign"></div><div id="grain"></div>

  <!-- 水墨侧影女子 -->
  <div id="silhouette">
    <svg viewBox="0 0 260 540" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="ink1" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#2c2820" stop-opacity=".96"/>
          <stop offset="60%" stop-color="#3a3228" stop-opacity=".92"/>
          <stop offset="100%" stop-color="#2c2820" stop-opacity=".72"/>
        </linearGradient>
        <linearGradient id="sleeve1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#2c2820" stop-opacity=".88"/>
          <stop offset="100%" stop-color="#2c2820" stop-opacity=".52"/>
        </linearGradient>
        <filter id="blur1" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="2.5"/>
        </filter>
        <filter id="blur2" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="6"/>
        </filter>
      </defs>
      <!-- 落影 -->
      <ellipse cx="130" cy="534" rx="72" ry="7" fill="#2c2820" opacity=".14" filter="url(#blur2)"/>
      <!-- 裙摆 宽大 -->
      <path d="M90 330 C72 370 56 430 50 490 C46 516 54 530 76 532 L184 532 C206 530 214 516 210 490 C204 430 188 370 170 330 Z" fill="url(#ink1)"/>
      <!-- 裙摆墨晕 -->
      <path d="M80 380 C70 420 62 468 58 508 C64 504 72 508 76 520 L90 330 Z" fill="#2c2820" opacity=".18"/>
      <path d="M180 380 C190 420 198 468 202 508 C196 504 188 508 184 520 L170 330 Z" fill="#2c2820" opacity=".18"/>
      <!-- 腰带 -->
      <path d="M86 310 C108 322 152 322 174 310 L178 328 C156 342 104 342 82 328 Z" fill="#2c2820" opacity=".82"/>
      <!-- 帔帛飘带 右侧飘动 -->
      <path d="M174 180 C194 200 210 240 218 300 C222 326 218 340 210 344 C206 332 204 318 202 302 C196 260 186 220 170 198 Z" fill="#2c2820" opacity=".44"/>
      <!-- 大袖左 -->
      <path d="M92 200 C60 214 32 254 18 296 C14 312 20 320 34 318 C50 316 66 296 78 272 C90 250 96 226 100 210 Z" fill="url(#sleeve1)"/>
      <!-- 大袖左墨边 -->
      <path d="M18 296 C32 300 50 294 68 278 C56 296 40 316 34 318 C20 320 14 312 18 296 Z" fill="#2c2820" opacity=".36"/>
      <!-- 大袖右 -->
      <path d="M168 200 C196 212 224 248 238 286 C244 304 238 314 224 314 C208 312 194 294 184 270 C174 248 168 224 164 208 Z" fill="url(#sleeve1)"/>
      <!-- 袖端衣纹 左 -->
      <path d="M34 318 C46 312 60 306 72 294" stroke="#2c2820" stroke-width="1.4" fill="none" opacity=".42" stroke-linecap="round"/>
      <!-- 袖端衣纹 右 -->
      <path d="M224 314 C212 308 200 302 190 290" stroke="#2c2820" stroke-width="1.4" fill="none" opacity=".42" stroke-linecap="round"/>
      <!-- 身躯 -->
      <path d="M102 130 C90 148 84 172 84 200 L96 210 C104 200 112 196 130 196 C148 196 156 200 164 210 L176 200 C176 172 170 148 158 130 Z" fill="#2c2820" opacity=".9"/>
      <!-- 衣纹竖线 -->
      <g stroke="#2c2820" stroke-width="1.1" fill="none" opacity=".28">
        <path d="M104 200 C102 240 98 280 94 330"/>
        <path d="M130 196 C130 240 130 282 130 330"/>
        <path d="M156 200 C158 240 162 280 166 330"/>
      </g>
      <!-- 领口 白领 -->
      <path d="M114 128 C114 120 126 118 130 118 C134 118 146 120 146 128 L140 138 C136 134 130 132 130 132 C130 132 124 134 120 138 Z" fill="#f0ebe0" opacity=".9"/>
      <!-- 颈 -->
      <path d="M122 96 L138 96 L140 122 L120 122 Z" fill="#d8c8b4" opacity=".94"/>
      <!-- 发髻 侧面 只看轮廓 -->
      <path d="M98 52 C96 36 104 18 130 14 C158 10 170 28 168 50 C170 64 164 78 154 88 L130 98 L106 88 C96 78 90 66 98 52 Z" fill="#2c2820" opacity=".94"/>
      <!-- 发髻高耸 -->
      <ellipse cx="130" cy="24" rx="16" ry="20" fill="#2c2820" opacity=".9"/>
      <path d="M114 24 C114 10 122 2 130 0 C138 2 146 10 146 24 Z" fill="#2c2820" opacity=".85"/>
      <!-- 发簪 -->
      <line x1="130" y1="2" x2="155" y2="-8" stroke="#c8a468" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="156" cy="-9" r="3.5" fill="#d8b47a"/>
      <!-- 鬓发垂丝 -->
      <path d="M106 88 C100 104 98 116 102 126" stroke="#2c2820" stroke-width="2" fill="none" opacity=".6" stroke-linecap="round"/>
      <path d="M154 88 C160 104 162 116 158 126" stroke="#2c2820" stroke-width="2" fill="none" opacity=".6" stroke-linecap="round"/>
      <!-- 水墨飞白 衣角边缘 -->
      <path d="M50 492 C48 508 50 524 56 532" stroke="#2c2820" stroke-width="1.4" fill="none" opacity=".36" stroke-linecap="round"/>
      <path d="M210 492 C212 508 210 524 204 532" stroke="#2c2820" stroke-width="1.4" fill="none" opacity=".36" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- 对话气泡 -->
  <div class="say btm" id="say"><i>心 园</i><p></p></div>

  <div id="hud"><div id="gname"></div><div id="gtip"></div><div id="prog"><i></i></div></div>

  <!-- 序 -->
  <div class="layer paper on" id="s0">
    <div class="seal">借 景 明 心</div>
    <h1>八相心园</h1>
    <div class="rule"></div>
    <div class="sub">生辰定气局　情志归五脏<br>叠山理水　移步明心</div>
    <div style="height:var(--sp32)"></div>
    <button class="btn" id="b0">入　园</button>
  </div>

  <!-- 生辰 -->
  <div class="layer paper" id="s1">
    <div class="seal">其 一 · 先 天 气 局</div>
    <div class="sub" style="margin-bottom:var(--sp24)">报上生辰，为你起一座荒园</div>
    <div class="birth">
      <div class="fld"><label>年</label><input id="by" type="number" value="1996" min="1901" max="2026"></div>
      <div class="fld"><label>月</label><input id="bm" type="number" value="4" min="1" max="12"></div>
      <div class="fld"><label>日</label><input id="bd" type="number" value="12" min="1" max="31"></div>
    </div>
    <div class="birth" style="margin-top:-4px">
      <div class="fld w"><label>时辰</label><select id="bh"></select></div>
    </div>
    <button class="btn" id="b1">起　园</button>
  </div>

  <!-- PAD 情绪问卷 -->
  <div class="layer paper" id="s_quiz">
    <div class="seal">其 二 · 情 绪 三 维</div>
    <div class="sub" style="margin:10px 0 var(--sp16)">三道直觉题，无对错之分</div>
    <div class="q-prog" id="qdots"></div>
    <div id="quiz"></div>
  </div>

  <!-- 泼墨 -->
  <div class="layer paper shift" id="s2">
    <div class="seal">其 三 · 今 日 心 色</div>
    <div class="sub" style="margin:8px 0 2px">不必思索，择二三色滴入池中</div>
    <div id="inkwrap"><canvas id="inkc"></canvas></div>
    <div id="inkhint"></div>
    <div class="hues" id="hues"></div>
    <div id="deg"><label>此 情 有 多 重</label><input id="degr" type="range" min="1" max="5" value="3"><div id="degv"></div></div>
    <button class="btn dim" id="b2">入　境</button>
  </div>

  <!-- 心相过场 -->

function ganzhi(y,m,d,h){
  let yy=(m<2||(m===2&&d<4))?y-1:y;
  const ys=((yy-4)%10+10)%10, yz=((yy-4)%12+12)%12;

  let mo=(d<cut[m])?m-1:m; if(mo<1)mo=12;
  const mIdx=(mo-2+12)%12, head=[2,4,6,8,0][ys%5];
  const ms=(head+mIdx)%10, mz=(mIdx+2)%12;
  const days=Math.floor((Date.UTC(y,m-1,d)-Date.UTC(2000,0,1))/864e5);
  const ds=((4+days)%10+10)%10, dz=((6+days)%12+12)%12;
  const hz=Math.floor(((h+1)%24)/2), hs=(ds*2+hz)%10;
  const cnt={木:0,火:0,土:0,金:0,水:0};
  const gw=[1,1.2,1.6,1], zw=[1,1.6,1.2,1];
  [ys,ms,ds,hs].forEach((i,k)=>cnt[GAN_EL[i]]+=gw[k]);
  [yz,mz,dz,hz].forEach((i,k)=>cnt[ZHI_EL[i]]+=zw[k]);
  const ord=Object.keys(cnt).sort((a,b)=>cnt[a]-cnt[b]);
  return {pillars:[GAN[ys]+ZHI[yz],GAN[ms]+ZHI[mz],GAN[ds]+ZHI[dz],GAN[hs]+ZHI[hz]],

function ensureAC(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();}

  ensureAC(); const t=AC.currentTime;
  const osc=AC.createOscillator(); const g=AC.createGain();
  const filt=AC.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=900;
  osc.connect(filt);filt.connect(g);g.connect(AC.destination);
  osc.frequency.setValueAtTime(820,t); osc.frequency.exponentialRampToValueAtTime(380,t+.18);
  g.gain.setValueAtTime(.22,t); g.gain.exponentialRampToValueAtTime(.0001,t+.38);
  osc.start(t); osc.stop(t+.38);
}
function guqinNote(freq,dur,vol){
  ensureAC(); const t=AC.currentTime;
  const osc=AC.createOscillator(); const g=AC.createGain();
  osc.type='sawtooth'; osc.frequency.value=freq;
  // 泛音叠加
  const osc2=AC.createOscillator(); const g2=AC.createGain();
  osc2.type='sine'; osc2.frequency.value=freq*2; g2.gain.value=.18;
  const filt=AC.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=1200;
  osc.connect(filt);osc2.connect(g2);g2.connect(filt);filt.connect(g);g.connect(AC.destination);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.04);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  osc.start(t);osc2.start(t);osc.stop(t+dur);osc2.stop(t+dur);
}
const SCALES=[196,220,261.6,293.7,329.6,392,440,523.3]; // 五声音阶扩展
function playChord(){
  const fs=[SCALES[0],SCALES[2],SCALES[4]];
  fs.forEach((f,i)=>setTimeout(()=>guqinNote(f,1.8+i*.4,.08),i*80));
}
function playMelody(){
  const seq=[4,2,0,2,4,4,4,2,2,2,4,6,6];
  seq.forEach((n,i)=>setTimeout(()=>guqinNote(SCALES[n],.9,.07),i*260+200));
}

  for(let i=0;i<7;i++){

    p.position.set(-5.2+i*1.75,4.4,-2.2+i*.3); p.rotation.set(-.3,.16,.3); sc.add(p);

  // 粒子

  const dg=new THREE.BufferGeometry(); dg.setAttribute('position',new THREE.BufferAttribute(pa2,3));

  Object.assign(W,{r,sc,cam,sun,hemi,rim,fill,water,wuni,rayMat,peak,bams,dust,pa:pa2,sp,

  let ri=0; W.ripple=(x,z,s)=>{W.wuni.uRip.value[ri++%10].set(x,z,s);};
  W.setScene=setScene;

/* 八相独立场景切换 */
function setScene(key){
  if(!W.plumGroup)return;
  W.plumGroup.visible =(key==='hope');
  W.anxGroup.visible  =(key==='anx');
  W.rainGroup.visible =(key==='sad');
  W.joyGroup.visible  =(key==='joy');
  W.calmGroup.visible =(key==='calm');
  W.firmGroup.visible =(key==='firm');
  W.lostGroup.visible =(key==='lost');
  // 竹林：扫竹相竹子更密更高，宁静相稀疏
  W.bams.forEach((g,i)=>{
    g.userData.alive=true; g.rotation.z=g.userData.base; g.position.y=0; g.visible=true;
    if(key==='calm'&&i%2===0) g.visible=false;
    if(key==='ang') g.scale.setScalar(1.14);
  });
  // 荷叶仅在悲伤/宁静显现
  W.lotusGroup.visible=(key==='sad'||key==='calm'||key==='hope');
  // 散石复位
  W.looseStones.forEach(st=>{
    st.userData.placed=false;
    st.position.set(...st.userData.home);
  });
  W.dewDrops.forEach(d=>{d.userData.caught=false;d.visible=true;});
}

// 扫竹——真实吹折交互
function breakBamboo(idx){
  if(idx>=W.bams.length)return;
  const g=W.bams[idx];
  if(!g.userData.alive)return;
  g.userData.alive=false;
  const dir=Math.sign(g.userData.base+.01); let prog=0;
  const fall=setInterval(()=>{
    prog+=.022; g.rotation.z=g.userData.base+dir*prog*1.2;
    g.position.y=-prog*0.9;
    if(prog>=1){ clearInterval(fall);
      // 竹叶散落粒子
      for(let i=0;i<12;i++){
        const idx2=Math.floor(rnd(0,W.pa.length/3));
        W.pa[idx2*3]=g.position.x+rnd(-.8,.8);
        W.pa[idx2*3+1]=rnd(.5,2.8);
        W.pa[idx2*3+2]=g.position.z+rnd(-.5,.5);
      }
      W.dust.geometry.attributes.position.needsUpdate=true;
      dropSound(); playChord();
    }
  },18);
}

function tint(x,deg){
  const k=.6+deg*.16;
  const sky=new THREE.Color(x.sky[0],x.sky[1],x.sky[2]);
  const paper=new THREE.Color(0xf0ebe0);
  const bg=paper.clone().lerp(sky,.3*k);
  W.sc.background.copy(bg); W.sc.fog.color.copy(bg);
  W.sc.fog.density=.014+x.fog*.018*k;
  W.hemi.color.copy(paper.clone().lerp(sky,.52));
  W.hemi.intensity=1.1-x.fog*.14;
  W.sun.color.setRGB(lerp(.92,1,x.warm),lerp(.94,.96,x.warm),lerp(1,.82,x.warm));
  W.sun.intensity=1.6+x.warm*1.2;
  W.rim.color.copy(sky);
  W.fill.color.set(x.hue); W.fill.intensity=(.38+x.warm*.76)*k;
  W.wuni.uDeep.value.setRGB(x.water[0]*.74,x.water[1]*.74,x.water[2]*.74);
  W.wuni.uShallow.value.setRGB(clamp(x.water[0]*1.6,0,1),clamp(x.water[1]*1.6,0,1),clamp(x.water[2]*1.6,0,1));
  W.wuni.uMurk.value=x.murk*k; W.wuni.uWarm.value=x.warm;
  W.jadeStone.color.setRGB(x.stone[0],x.stone[1],x.stone[2]);
  W.jadeStone.attenuationColor.setRGB(x.stone[0]*.44,x.stone[1]*.54,x.stone[2]*.48);
  W.jadeWall.sheenColor.set(x.hue);
  W.rayMat.uniforms.uCol.value.set(x.hue).lerp(new THREE.Color(0xfff6e0),.6);
  W.rayMat.uniforms.uInt.value=.12+x.warm*.28;
  if(S.bazi){
    const bz=S.bazi;
    W.wuni.uMurk.value=clamp(W.wuni.uMurk.value+(bz.weak==='水'?.24:0),0,1);
    const bScale=bz.weak==='木'?.68:(bz.strong==='木'?1.1:1);
    W.bams.forEach(g=>{if(g.userData.alive)g.scale.setScalar(bScale);});
  }
  W.setScene(x.k);
}

let mx=0,my=0;
$('#frame').addEventListener('pointermove',e=>{
  const r=$('#frame').getBoundingClientRect();
  mx=((e.clientX-r.left)/r.width-.5)*2; my=((e.clientY-r.top)/r.height-.5)*2;
});

function resize(){
  const fr=$('#frame'),w=fr.clientWidth,h=fr.clientHeight;
  W.r.setSize(w,h,false); W.cam.aspect=w/h; W.cam.updateProjectionMatrix();

function animate(){
  requestAnimationFrame(animate);
  const t=performance.now()/1000;
  W.wuni.uTime.value=t; W.rayMat.uniforms.uTime.value=t;
  W.wuni.uRip.value.forEach(v=>{if(v.z>0)v.z=Math.max(0,v.z-.0075);});
  W.bams.forEach((g,i)=>{
    if(g.userData.alive) g.rotation.z=g.userData.base+Math.sin(t*.62+g.userData.ph)*.055+Math.sin(t*1.5+i)*.016;
  });
  // 露珠晃动
  if(W.dewDrops){
    W.dewDrops.forEach(d=>{
      if(!d.userData.caught)
        d.position.y=d.userData.base+Math.sin(t*1.4+d.userData.phase)*.04;
    });
  }
  // 焦虑：墙上狂乱树影剧烈摆动
  if(W.anxGroup&&W.anxGroup.visible){
    W.wildShadows.forEach(s=>{
      const u=s.userData;
      s.position.x=u.bx+Math.sin(t*2.1+u.ph)*u.amp+Math.sin(t*5.3+u.ph*2)*u.amp*.34;
      s.rotation.z=Math.sin(t*1.7+u.ph)*.20;
      s.material.opacity=.20+.12*Math.abs(Math.sin(t*1.3+u.ph));
    });
  }
  // 悲伤：雨丝下落 + 落水自生涟漪
  if(W.rainGroup&&W.rainGroup.visible){
    for(let i=0;i<W.RN;i++){
      W.rainPos[i*3+1]-=W.rainVel[i];
      if(W.rainPos[i*3+1]<0){
        const rx=W.rainPos[i*3], rz=W.rainPos[i*3+2];
        if(Math.abs(rx)<3.2&&Math.abs(rz-0.9)<2.1&&Math.random()<.16)
          W.ripple(rx,rz-0.9,.42);
        W.rainPos[i*3]=rnd(-8,8); W.rainPos[i*3+1]=rnd(9,11.5); W.rainPos[i*3+2]=rnd(-5,6);
      }
    }
    W.rain.geometry.attributes.position.needsUpdate=true;
  }
  // 喜悦：金斑游移呼吸
  if(W.joyGroup&&W.joyGroup.visible){
    W.goldSpots.forEach(g=>{
      const u=g.userData;
      g.position.x=u.bx+Math.sin(t*.52+u.ph)*.34;
      g.position.y=u.by+Math.cos(t*.42+u.ph)*.20;
      g.material.opacity=.26+.22*Math.abs(Math.sin(t*.8+u.ph));
      const s2=1+Math.sin(t*.9+u.ph)*.16; g.scale.setScalar(s2);
    });
  }
  // 迷茫：月洞门微光呼吸
  if(W.lostGroup&&W.lostGroup.visible){
    W.doorGlow.material.opacity=.20+.16*Math.sin(t*.68);
    W.doorGlow.scale.setScalar(1+Math.sin(t*.5)*.05);
  }
  // 呼吸引导（宁静相）驱动水面
  if(BREATH.active){
    const ph=BREATH.phase(t);
    W.wuni.uRip.value[0].set(0,0,ph*.5);
  }
  // 梅花轻颤
  if(W.plumGroup&&W.plumGroup.visible){
    W.plumGroup.children.forEach((c,i)=>{
      if(c.userData&&c.userData.phase!==undefined)
        c.rotation.z=Math.sin(t*.8+c.userData.phase)*.06;
    });
  }
  for(let i=0;i<W.sp.length;i++){
    W.pa[i*3+1]+=W.sp[i]*.0055; W.pa[i*3]+=Math.sin(t*.3+i)*.0015;
    if(W.pa[i*3+1]>6.5)W.pa[i*3+1]=0;
  }
  W.dust.geometry.attributes.position.needsUpdate=true;
  W.cam.position.set(lerp(W.cam.position.x,mx*.72,.045),
    lerp(W.cam.position.y,2-my*.36+Math.sin(t*.34)*.05,.045),10.6+Math.sin(t*.22)*.16);
  W.cam.lookAt(0,1.92,0);
  W.r.render(W.sc,W.cam);
}

/* ════════════════ 呼吸引导（4-7-8） ════════════════ */
const BREATH={active:false,t0:0,cycles:0,need:3,
  phase(t){
    const e=(t-this.t0)%19; // 4吸 + 7屏 + 8呼
    if(e<4) return e/4;
    if(e<11) return 1;
    return 1-(e-11)/8;
  },
  label(t){
    const e=(t-this.t0)%19;
    if(e<4) return ['吸　气',Math.ceil(4-e)];
    if(e<11) return ['屏　息',Math.ceil(11-e)];
    return ['呼　气',Math.ceil(19-e)];
  }};

/* ════════════════ 雾层 ════════════════ */
const FOG={painted:false};
(function(){
  const c=$('#fogc'),x=c.getContext('2d');
  FOG.repaint=()=>{
    const w=c.width,h=c.height;
    x.globalCompositeOperation='source-over'; x.clearRect(0,0,w,h);
    const g=x.createRadialGradient(w*.5,h*.42,w*.05,w*.5,h*.5,w*.95);
    g.addColorStop(0,'rgba(248,244,236,.78)');g.addColorStop(.55,'rgba(236,230,218,.92)');
    g.addColorStop(1,'rgba(222,214,200,.98)');
    x.fillStyle=g;x.fillRect(0,0,w,h);
    for(let i=0;i<60;i++){
      const px=Math.random()*w,py=Math.random()*h,rr=(50+Math.random()*180)*devicePixelRatio;
      const rg=x.createRadialGradient(px,py,0,px,py,rr);
      rg.addColorStop(0,'rgba(255,255,255,.32)');rg.addColorStop(1,'rgba(255,255,255,0)');
      x.fillStyle=rg;x.beginPath();x.arc(px,py,rr,0,6.29);x.fill();
    }
    FOG.painted=true;
  };
  FOG.hide=()=>{x.clearRect(0,0,c.width,c.height);FOG.painted=false;};
  FOG.wipe=(cx,cy)=>{
    const R=68*devicePixelRatio;
    x.globalCompositeOperation='destination-out';
    const g=x.createRadialGradient(cx,cy,0,cx,cy,R);
    g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.55,'rgba(0,0,0,.72)');g.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=g;x.beginPath();x.arc(cx,cy,R,0,6.29);x.fill();
  };
  FOG.ratio=()=>{
    const w=c.width,h=c.height,st=18,d=x.getImageData(0,0,w,h).data;
    let tot=0,clr=0;
    for(let yy=0;yy<h;yy+=st)for(let xx=0;xx<w;xx+=st){tot++;if(d[(yy*w+xx)*4+3]<70)clr++;}
    return clr/Math.max(1,tot);
  };
})();

/* ════════════════ 泼墨池 ════════════════ */
const INK={blobs:[],t:0};
(function(){
  const c=$('#inkc'),x=c.getContext('2d');
  INK.fit=()=>{const r=c.getBoundingClientRect();c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;};
  INK.add=(hex,w0)=>{INK.blobs.push({x:c.width*(.28+Math.random()*.44),y:c.height*(.26+Math.random()*.44),
    r:4*devicePixelRatio,max:(36+w0*15)*devicePixelRatio,c:hex,a:0});};
  INK.clear=()=>{INK.blobs=[];};
  INK.reweight=(w0)=>{INK.blobs.forEach((b,i)=>{b.max=(i===0?40+w0*14:32+w0*9)*devicePixelRatio;});};
  (function loop(){
    requestAnimationFrame(loop); INK.t+=.016;
    const w=c.width,h=c.height;
    x.globalCompositeOperation='source-over';
    const bg=x.createRadialGradient(w*.4,h*.32,0,w*.5,h*.5,w*.62);
    bg.addColorStop(0,'#faf6ec');bg.addColorStop(1,'#ede5d4');
    x.fillStyle=bg;x.fillRect(0,0,w,h);
    x.globalCompositeOperation='multiply';
    INK.blobs.forEach((b,i)=>{
      b.r=lerp(b.r,b.max,.02);b.a=lerp(b.a,.62,.03);
      for(let k=0;k<5;k++){
        const wob=Math.sin(INK.t*1.1+k*1.6+i)*b.r*.22;
        const px=b.x+Math.cos(k*1.26+INK.t*.28+i)*b.r*.44+wob*.3;
        const py=b.y+Math.sin(k*1.26+INK.t*.28+i)*b.r*.44+wob*.3;
        const rr=b.r*(.64+.2*Math.sin(INK.t*.9+k+i));
        const g2=x.createRadialGradient(px,py,0,px,py,rr);
        g2.addColorStop(0,hexA(b.c,b.a*.54));g2.addColorStop(.6,hexA(b.c,b.a*.18));g2.addColorStop(1,hexA(b.c,0));
        x.fillStyle=g2;x.beginPath();x.arc(px,py,rr,0,6.29);x.fill();
      }});
  })();
})();
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}

  calm:['breathe','flow'],   // 宁静：呼吸引导 → 理水
  hope:['dewCatch','wipe'],  // 期待：留春 → 拨云
  firm:['stack','catch']     // 笃定：叠石 → 承光
};
const GT={
  wipe:{n:'拨　云',t:'指尖抹开眼前的雾'},
  flow:{n:'理　水',t:'划过水面，让它重新流动'},
  catch:{n:'承　光',t:'点住墙上的光，留住它'},
  break:{n:'扫　竹',t:'划过竹子，借风清暑'},
  dewCatch:{n:'留　春',t:'轻触露珠，把春留下来'},
  iceWin:{n:'框　景',t:'把墙上乱影，一一框进漏窗'},
  doorFocus:{n:'聚　焦',t:'长按月洞门，只看这一处'},
  rainCalm:{n:'听　雨',t:'什么都不做，听满三十滴'},
  breathe:{n:'调　息',t:'跟着水面起伏，吸七呼八'},
  stack:{n:'叠　石',t:'把散石一块块叠成峰'}
};
const STAGE_SAY={
  wipe:'眼前这片雾，我不替你抹。',
  flow:'水自己不会动，得有人先划一道。',
  catch:'光会走的。要留就现在。',
  break:'风来了。借这阵风，把多余的都让它带走。',
  dewCatch:'露珠还挂着呢。轻轻一碰，春就算是真的来了。',
  iceWin:'墙上那些影子吓不到人。框起来看，它们就只是竹子。',
  doorFocus:'院子太大反而看不见路。按住那扇门，别的先不管。',
  rainCalm:'这一关不用做什么。坐着，听雨落满三十下。',
  breathe:'跟着水面走。它涨你吸，它落你呼。',
  stack:'石头是碎的。碎的也能立成峰——你试试。'
};
let seq=[],stage=0;
function startGame(){
  S.t0=performance.now(); S.trace={wipe:0,flow:0,catch:0,breaks:0};
  seq=FLOW[S.x.k]; stage=0; $('#hud').classList.add('on'); runStage();
}
function setHud(p){
  const g=GT[seq[stage]];
  $('#gname').textContent=g.n; $('#gtip').textContent=g.t;
  $('#prog i').style.width=(p*100)+'%';
}
function runStage(){
  if(stage>=seq.length){finish();return;}
  const kind=seq[stage];
  setTimeout(()=>{showSil(true);saySomething(STAGE_SAY[kind],false,'btm');},300);
  if(kind==='wipe'){FOG.repaint();setHud(0);bindWipe();}
  else if(kind==='flow'){FOG.hide();setHud(0);bindFlow();}
  else if(kind==='catch'){FOG.hide();setHud(0);spawnSparks();}
  else if(kind==='break'){FOG.hide();setHud(0);bindBreak();}
  else if(kind==='dewCatch'){FOG.hide();setHud(0);spawnDew();}
  else if(kind==='iceWin'){FOG.hide();setHud(0);bindIceWin();}
  else if(kind==='doorFocus'){FOG.hide();setHud(0);bindDoorFocus();}
  else if(kind==='rainCalm'){FOG.hide();setHud(0);bindRainCalm();}
  else if(kind==='breathe'){FOG.hide();setHud(0);bindBreathe();}
  else if(kind==='stack'){FOG.hide();setHud(0);bindStack();}
}

/* 框景：点击墙上狂乱树影，逐一框入漏窗 */
function bindIceWin(){
  const el=$('#gl'); el.style.pointerEvents='auto';
  const rc=new THREE.Raycaster(), v=new THREE.Vector2();
  let framed=0; const need=Math.min(5,W.wildShadows.length);
  const click=e=>{
    const r=el.getBoundingClientRect();
    v.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
    rc.setFromCamera(v,W.cam);
    const live=W.wildShadows.filter(s=>s.visible);
    const hits=rc.intersectObjects(live,false);
    if(hits.length){
      const s=hits[0].object;
      // 影子被吸入漏窗
      const sx=s.position.x, sy=s.position.y; let pr=0;
      const anim=setInterval(()=>{
        pr+=.06;
        s.position.x=lerp(sx,-3.1,pr); s.position.y=lerp(sy,2.7,pr);
        s.scale.setScalar(1-pr*.8); s.material.opacity=.26*(1-pr);
        if(pr>=1){clearInterval(anim); s.visible=false;}
      },16);
      framed++; S.trace.catch++;
      guqinNote(SCALES[2+framed%4],.7,.08);
      setHud(framed/need);
      if(framed>=need){off();advance();}
    }};
  function off(){el.removeEventListener('pointerdown',click);el.style.pointerEvents='none';
    W.wildShadows.forEach(s=>{s.visible=true;s.scale.setScalar(1);s.material.opacity=.26;});}
  el.addEventListener('pointerdown',click);
}

/* 聚焦：长按月洞门，周围渐隐，只留一门 */
function bindDoorFocus(){
  const el=$('#gl'); el.style.pointerEvents='auto';
  let held=0, timer=null;
  const need=260; // 约 4.3 秒
  const start=()=>{
    if(timer)return;
    timer=setInterval(()=>{
      held++;
      const p=clamp(held/need,0,1);
      W.doorGlow.material.opacity=.20+p*.55;
      W.doorGlow.scale.setScalar(1+p*.22);
      // 周围压暗
      W.hemi.intensity=1.1-p*.52;
      W.rayMat.uniforms.uInt.value=Math.max(.02,(.12+S.x.warm*.28)*(1-p*.8));
      W.sc.fog.density=(.014+S.x.fog*.018)*(1+p*1.4);
      setHud(p);
      if(held>=need){stop();off();advance();}
    },16);
  };
  const stop=()=>{if(timer){clearInterval(timer);timer=null;}};
  function off(){
    el.removeEventListener('pointerdown',start);
    removeEventListener('pointerup',stop);
    el.style.pointerEvents='none';
    W.hemi.intensity=1.1; W.sc.fog.density=.014+S.x.fog*.018;
  }
  el.addEventListener('pointerdown',start);
  addEventListener('pointerup',stop);
}

/* 听雨：无操作关卡，坐等三十滴入水 */
function bindRainCalm(){
  let drops=0; const need=30;
  const iv=setInterval(()=>{
    drops++; 
    if(drops%3===0) dropSound();
    if(drops%8===0) guqinNote(SCALES[Math.floor(rnd(0,4))],1.4,.05);
    W.ripple(rnd(-2.6,2.6),rnd(-1.6,1.6),.6);
    W.wuni.uMurk.value=Math.max(.04,W.wuni.uMurk.value*.955);
    setHud(drops/need);
    if(drops>=need){clearInterval(iv);advance();}
  },340);
}

/* 调息：4-7-8 呼吸，跟随水面起伏 */
function bindBreathe(){
  BREATH.active=true; BREATH.t0=performance.now()/1000; BREATH.cycles=0;
  const box=document.createElement('div');
  box.id='breathbox';
  box.style.cssText=`position:absolute;left:0;right:0;top:44%;text-align:center;z-index:6;
    pointer-events:none;transition:.4s`;
  box.innerHTML=`<div id="bphase" style="font-size:26px;letter-spacing:.42em;color:#3a3228;
      text-shadow:0 2px 18px rgba(253,250,243,.96)"></div>
    <div id="bcount" style="font-size:44px;letter-spacing:.1em;color:#8c7f68;margin-top:10px;
      text-shadow:0 2px 14px rgba(253,250,243,.96)"></div>
    <div id="bcycle" style="font-size:10px;letter-spacing:.3em;color:#b8ac96;margin-top:16px"></div>`;
  $('#frame').appendChild(box);
  let lastPhase='';
  const iv=setInterval(()=>{
    const t=performance.now()/1000;
    const [lab,n]=BREATH.label(t);
    $('#bphase').textContent=lab;
    $('#bcount').textContent=n;
    if(lab!==lastPhase){
      lastPhase=lab;
      if(lab==='吸　气'){ guqinNote(SCALES[0],1.6,.06); BREATH.cycles++; }
      else if(lab==='呼　气') guqinNote(SCALES[2],2.0,.05);
      else dropSound();
    }
    $('#bcycle').textContent=`第 ${Math.min(BREATH.cycles,BREATH.need)} / ${BREATH.need} 息`;
    setHud(clamp(BREATH.cycles/BREATH.need,0,1));
    // 呼吸驱动光影
    const ph=BREATH.phase(t);
    W.fill.intensity=(.38+S.x.warm*.76)*(.7+ph*.6);
    if(BREATH.cycles>BREATH.need){
      clearInterval(iv); BREATH.active=false;
      box.style.opacity='0'; setTimeout(()=>box.remove(),420);
      advance();
    }
  },100);
}

/* 叠石：拖散石到基座，逐块叠成峰 */
function bindStack(){
  const el=$('#gl'); el.style.pointerEvents='auto';
  const rc=new THREE.Raycaster(), v=new THREE.Vector2();
  let placed=0; const need=W.looseStones.length;
  const click=e=>{
    const r=el.getBoundingClientRect();
    v.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
    rc.setFromCamera(v,W.cam);
    const live=W.looseStones.filter(s=>!s.userData.placed);
    const hits=rc.intersectObjects(live,false);
    if(hits.length){
      const st=hits[0].object;
      const slot=W.STONE_SLOTS[placed];
      const p0=st.position.clone(); let pr=0;
      st.userData.placed=true;
      const anim=setInterval(()=>{
        pr+=.05;
        // 抛物线上抬
        st.position.x=lerp(p0.x,slot[0],pr);
        st.position.z=lerp(p0.z,slot[2],pr);
        st.position.y=lerp(p0.y,slot[1],pr)+Math.sin(pr*Math.PI)*.7;
        st.rotation.y+=.08;
        if(pr>=1){clearInterval(anim);
          st.position.set(slot[0],slot[1],slot[2]);
          dropSound(); guqinNote(SCALES[placed%5],1.2,.09);}
      },16);
      placed++; setHud(placed/need);
      if(placed>=need){off();setTimeout(advance,700);}
    }};
  function off(){el.removeEventListener('pointerdown',click);el.style.pointerEvents='none';}
  el.addEventListener('pointerdown',click);
}
function advance(){$('#prog i').style.width='100%';hideSay();stage++;setTimeout(runStage,540);}

function bindWipe(){
  const c=$('#fogc');let down=false,last=null;
  c.style.pointerEvents='auto';
  const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*devicePixelRatio,(e.clientY-r.top)*devicePixelRatio];};
  const on=e=>{down=true;last=pt(e);FOG.wipe(...last);};
  const mv=e=>{if(!down)return;const p=pt(e);
    if(last){const dd=Math.hypot(p[0]-last[0],p[1]-last[1])/devicePixelRatio;S.trace.wipe+=dd;
      const st=Math.max(1,Math.ceil(dd/18));
      for(let i=1;i<=st;i++)FOG.wipe(lerp(last[0],p[0],i/st),lerp(last[1],p[1],i/st));}
    last=p;const rt=FOG.ratio();setHud(clamp(rt/.6,0,1));
    if(rt>.6){off();advance();}};
  const up=()=>{down=false;last=null;};
  function off(){c.removeEventListener('pointerdown',on);c.removeEventListener('pointermove',mv);
    removeEventListener('pointerup',up);c.style.pointerEvents='none';}
  c.addEventListener('pointerdown',on);c.addEventListener('pointermove',mv);addEventListener('pointerup',up);
}
function bindFlow(){
  const el=$('#gl');el.style.pointerEvents='auto';
  const rc=new THREE.Raycaster(),v=new THREE.Vector2();
  let down=false,last=null,acc=0;
  const hit=e=>{const r=el.getBoundingClientRect();
    v.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
    rc.setFromCamera(v,W.cam);const h=rc.intersectObject(W.water,false);
    if(!h.length)return null;const lp=W.water.worldToLocal(h[0].point.clone());return[lp.x,lp.y];};
  const on=e=>{down=true;const p=hit(e);if(p){last=p;W.ripple(p[0],p[1],1);}};
  const mv=e=>{if(!down)return;const p=hit(e);if(!p)return;
    if(last){const dd=Math.hypot(p[0]-last[0],p[1]-last[1]);acc+=dd;S.trace.flow+=dd;
      if(dd>.1)W.ripple(p[0],p[1],.92);}
    last=p;const base=S.x.murk*(.6+S.deg*.16);
    W.wuni.uMurk.value=Math.max(.03,base*(1-clamp(acc/13,0,1)));
    setHud(clamp(acc/13,0,1));if(acc>13){off();advance();}};
  const up=()=>{down=false;last=null;};
  function off(){el.removeEventListener('pointerdown',on);el.removeEventListener('pointermove',mv);
    removeEventListener('pointerup',up);el.style.pointerEvents='none';}
  el.addEventListener('pointerdown',on);el.addEventListener('pointermove',mv);addEventListener('pointerup',up);
}
function bindBreak(){
  // 扫竹：在竹上滑动即折倒
  const el=$('#gl');el.style.pointerEvents='auto';
  let broken=0,needed=Math.min(5,W.bams.length);
  const rc=new THREE.Raycaster(),v=new THREE.Vector2();
  const mv=e=>{
    const r=el.getBoundingClientRect();
    v.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
    rc.setFromCamera(v,W.cam);
    const meshes=W.bams.filter(g=>g.userData.alive).map(g=>g.children[0]);
    const hits=rc.intersectObjects(meshes,false);
    if(hits.length){
      const bamIdx=W.bams.findIndex(g=>g.children.includes(hits[0].object));
      if(bamIdx>=0&&W.bams[bamIdx].userData.alive){
        breakBamboo(bamIdx); broken++; S.trace.breaks++;
        setHud(broken/needed);
        if(broken>=needed){off();advance();}
      }
    }};
  function off(){el.removeEventListener('pointermove',mv);el.style.pointerEvents='none';}
  el.addEventListener('pointermove',mv);
}
function spawnSparks(){
  const fr=$('#frame'),need=6;let got=0;
  [[.28,.36],[.44,.28],[.6,.34],[.7,.46],[.36,.5],[.54,.44]].forEach((p,i)=>{
    const s=document.createElement('div');s.className='spark';
    s.style.left=(p[0]*100)+'%';s.style.top=(p[1]*100)+'%';s.style.animationDelay=(i*.28)+'s';
    s.onclick=()=>{if(s.classList.contains('gone'))return;
      s.classList.add('gone');got++;S.trace.catch++;
      W.fill.intensity+=.24;W.rayMat.uniforms.uInt.value+=.04;
      dropSound(); setHud(got/need);setTimeout(()=>s.remove(),620);
      if(got>=need)advance();};
    fr.appendChild(s);
  });
}
function spawnDew(){
  // 露珠模式：点击3D场景中露珠
  const el=$('#gl');el.style.pointerEvents='auto';
  let caught=0,needed=Math.min(4,W.dewDrops.length);
  const rc=new THREE.Raycaster(),v=new THREE.Vector2();
  const click=e=>{
    const r=el.getBoundingClientRect();
    v.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
    rc.setFromCamera(v,W.cam);
    const meshes=W.dewDrops.filter(d=>!d.userData.caught);
    const hits=rc.intersectObjects(meshes,false);
    if(hits.length){
      const d=hits[0].object; d.userData.caught=true;
      d.visible=false; caught++; S.trace.catch++;
      dropSound(); guqinNote(SCALES[4],.8,.10);
      setHud(caught/needed);
      if(caught>=needed){off();advance();}
    }};
  function off(){el.removeEventListener('pointerdown',click);el.style.pointerEvents='none';}
  el.addEventListener('pointerdown',click);
}

/* ════════════════ 画卷生成（苏州五色·廊桥·漏窗·水榭·荷叶） ════════════════ */
function paintScroll(){
  const c=$('#scrollc'),DPR=Math.min(devicePixelRatio,2);
  const fw=$('#frame').clientWidth-48, fh=Math.round(fw*1.40);
  c.style.width=fw+'px'; c.style.height=fh+'px'; c.width=fw*DPR; c.height=fh*DPR;
  const x=c.getContext('2d'); x.scale(DPR,DPR);
  const W2=fw,H=fh, X=S.x, bz=S.bazi, k=.6+S.deg*.16;

  // 宣纸底
  const pg=x.createLinearGradient(0,0,0,H);
  pg.addColorStop(0,'#fbf7ee');pg.addColorStop(1,'#efe8d8');
  x.fillStyle=pg;x.fillRect(0,0,W2,H);
  // 噪点
  for(let i=0;i<3200;i++){x.fillStyle=`rgba(144,126,96,${Math.random()*.032})`;
    x.fillRect(Math.random()*W2,Math.random()*H,1,1);}

  // 天色渐变
  const skyGrad=x.createLinearGradient(0,0,0,H*.56);
  skyGrad.addColorStop(0,hexA(X.hue,.34*k));skyGrad.addColorStop(1,hexA(X.hue,0));
  x.fillStyle=skyGrad;x.fillRect(0,0,W2,H*.56);

  // 五行远山（每行数量决定层高）
  const els=['木','火','土','金','水'];
  els.forEach((e,i)=>{
    const amt=bz.cnt[e]/8, ybase=H*(.22+i*.042);
    x.beginPath();x.moveTo(0,ybase+44);
    for(let px=0;px<=W2;px+=7){
      const yy=ybase-Math.sin(px/W2*Math.PI*(1.1+i*.32)+i)*32*(.5+amt)-Math.sin(px/W2*Math.PI*5+i*2)*8*amt;
      x.lineTo(px,yy);
    }
    x.lineTo(W2,ybase+44);x.lineTo(W2,H);x.lineTo(0,H);x.closePath();
    x.fillStyle=hexA(EL_COLOR[e],.10+amt*.28);x.fill();
  });

  // 白墙 + 屋脊瓦片
  const wy=H*.44, wh=H*.22;
  x.fillStyle='rgba(253,251,246,.96)';x.fillRect(W2*.05,wy,W2*.90,wh);
  x.strokeStyle='rgba(120,104,80,.24)';x.lineWidth=1;x.strokeRect(W2*.05,wy,W2*.90,wh);
  // 瓦檐
  x.fillStyle='#565f67';x.fillRect(W2*.03,wy-10,W2*.94,10);
  const nTile=Math.floor(W2*.94/10);
  for(let i=0;i<nTile;i++){
    x.beginPath();x.arc(W2*.03+5.5+i*10,wy-10,5,Math.PI,0);
    x.fillStyle='#4b545c';x.fill();
  }
  // 飞檐翘角
  x.beginPath();x.moveTo(W2*.03,wy-10);x.quadraticCurveTo(0,wy-28,W2*.04,wy-22);
  x.lineWidth=3;x.strokeStyle='#4b545c';x.stroke();
  x.beginPath();x.moveTo(W2*.97,wy-10);x.quadraticCurveTo(W2,wy-28,W2*.96,wy-22);
  x.stroke();

  // 月洞门
  const mx0=W2*.5,my0=wy+wh*.52,mr=wh*.40;
  x.save();x.beginPath();x.arc(mx0,my0,mr,0,6.2832);x.clip();
  const mg=x.createLinearGradient(0,my0-mr,0,my0+mr);
  mg.addColorStop(0,hexA(X.hue,.38));mg.addColorStop(1,'rgba(226,232,238,.96)');
  x.fillStyle=mg;x.fillRect(mx0-mr,my0-mr,mr*2,mr*2);
  // 门内假山
  x.fillStyle='rgba(100,120,112,.48)';
  x.beginPath();x.moveTo(mx0-mr,my0+mr);
  for(let px=-mr;px<=mr;px+=4)x.lineTo(mx0+px,my0+8-Math.cos(px/mr*1.4)*mr*.38);
  x.lineTo(mx0+mr,my0+mr);x.closePath();x.fill();
  x.restore();
  x.beginPath();x.arc(mx0,my0,mr,0,6.2832);x.strokeStyle='#565f67';x.lineWidth=3.5;x.stroke();

  // 漏窗花格（左侧）
  const lx=W2*.12,ly=wy+wh*.22,ls=W2*.14;
  x.strokeStyle='rgba(90,99,107,.42)';x.lineWidth=1.2;
  x.strokeRect(lx,ly,ls,ls);
  const ng=4;
  for(let i=1;i<ng;i++){
    x.beginPath();x.moveTo(lx+ls*i/ng,ly);x.lineTo(lx+ls*i/ng,ly+ls);x.stroke();
    x.beginPath();x.moveTo(lx,ly+ls*i/ng);x.lineTo(lx+ls,ly+ls*i/ng);x.stroke();
  }
  // 菱格
  for(let i=0;i<ng;i++)for(let j=0;j<ng;j++){
    const cx=lx+ls*(i+.5)/ng,cy=ly+ls*(j+.5)/ng,r=ls/ng*.36;
    x.beginPath();x.moveTo(cx,cy-r);x.lineTo(cx+r,cy);x.lineTo(cx,cy+r);x.lineTo(cx-r,cy);x.closePath();
    x.strokeStyle='rgba(90,99,107,.32)';x.stroke();
  }

  // 廊桥（右侧）
  const bx0=W2*.64,bxE=W2*.95, bky=wy+wh*.82;
  x.fillStyle='rgba(210,202,186,.82)';
  x.fillRect(bx0,bky-6,bxE-bx0,6);
  const nc=5;
  for(let i=0;i<=nc;i++){
    const cx=bx0+(bxE-bx0)*i/nc;
    x.fillStyle='rgba(190,182,166,.72)';x.fillRect(cx-3,bky-18,6,18);
  }
  x.fillStyle='rgba(175,165,148,.64)';x.fillRect(bx0,bky-22,(bxE-bx0),4);

  // 水榭
  const px0=W2*.62,pky=wy+wh+8,pW=W2*.22,pH=W2*.10;
  x.fillStyle='rgba(248,245,238,.78)';x.fillRect(px0,pky,pW,pH);
  // 小屋脊
  x.fillStyle='#565f67';
  x.beginPath();x.moveTo(px0-4,pky);x.lineTo(px0+pW/2,pky-pH*.7);x.lineTo(px0+pW+4,pky);x.closePath();x.fill();

  // 水面（波纹数量=清浊）
  const wpy=H*.68;
  const wg=x.createLinearGradient(0,wpy,0,H*.92);
  wg.addColorStop(0,hexA(X.hue,.42*k));
  wg.addColorStop(1,`rgba(${Math.round(X.water[0]*255)},${Math.round(X.water[1]*255)},${Math.round(X.water[2]*255)},.60)`);
  x.fillStyle=wg;
  x.beginPath();x.moveTo(W2*.04,wpy+10);
  x.bezierCurveTo(W2*.3,wpy-6,W2*.7,wpy+20,W2*.96,wpy+4);
  x.lineTo(W2*.96,H*.91);x.lineTo(W2*.04,H*.91);x.closePath();x.fill();
  const ripN=Math.round(5+(1-W.wuni.uMurk.value)*11);
  for(let i=0;i<ripN;i++){
    const ry=wpy+20+i*((H*.88-wpy-20)/ripN);
    x.strokeStyle=`rgba(255,255,255,${.28-i*.014})`;x.lineWidth=1;
    x.beginPath();
    for(let px=W2*.06;px<W2*.94;px+=5)x.lineTo(px,ry+Math.sin(px/24+i)*2.2);
    x.stroke();
  }

  // 荷叶
  const soilAmt=bz.cnt['土']/8;
  [[.22,.3],[.40,.5],[.32,.7],[.18,.6],[.50,.4]].forEach((p,i)=>{
    const hx=W2*(p[0]+.02*i),hy=wpy+22+i*16,hr=(16+soilAmt*8)*DPR*.5;
    x.beginPath();x.ellipse(hx,hy,hr,hr*.64,i*.8,0,6.28);
    x.fillStyle=`rgba(92,138,104,${.40+i*.04})`;x.fill();
    // 叶脉
    x.strokeStyle=`rgba(68,110,80,${.24})`;x.lineWidth=1;
    for(let v2=0;v2<5;v2++){
      x.beginPath();x.moveTo(hx,hy);
      x.lineTo(hx+Math.cos(v2/5*6.28)*hr*.82,hy+Math.sin(v2/5*6.28)*hr*.54);x.stroke();
    }
  });

  // 太湖石（土气影响大小）
  function rock(cx,cy,rr,seed){
    x.beginPath();
    for(let a2=0;a2<=6.29;a2+=.16){
      const n2=1+Math.sin(a2*3+seed)*.22+Math.sin(a2*7+seed*2)*.12;
      const ppx=cx+Math.cos(a2)*rr*n2,ppy=cy+Math.sin(a2)*rr*n2*.9;
      a2<.01?x.moveTo(ppx,ppy):x.lineTo(ppx,ppy);
    }
    x.closePath();
    const rg=x.createLinearGradient(cx-rr,cy-rr,cx+rr,cy+rr);
    rg.addColorStop(0,hexA(EL_COLOR['木'],.54));rg.addColorStop(1,'rgba(88,104,96,.74)');
    x.fillStyle=rg;x.fill();
    x.strokeStyle='rgba(70,84,78,.44)';x.lineWidth=1.2;x.stroke();
    for(let h2=0;h2<3;h2++){
      const hx=cx+(Math.random()-.5)*rr,hy=cy+(Math.random()-.5)*rr*.9;
      x.beginPath();x.ellipse(hx,hy,rr*.14,rr*.09,Math.random()*3,0,6.28);
      x.fillStyle='rgba(252,248,240,.38)';x.fill();
    }
  }
  const rs=.85+soilAmt*.5;
  rock(W2*.18,wpy+6,wh*.28*rs,1.3); rock(W2*.22,wpy-wh*.2,wh*.18*rs,4.1);
  rock(W2*.82,wpy+12,wh*.20*rs,7.7);

  // 竹（木气决定数量+高度）
  const woodAmt=bz.cnt['木']/8, nb=Math.round(3+woodAmt*7);
  for(let i=0;i<nb;i++){
    const bx2=W2*(.07+Math.random()*.15)+(i%2?W2*.66:0);
    const bh2=wh*(1.4+woodAmt*1.3+Math.random()*.4), by2=wy+wh;
    x.strokeStyle=`rgba(106,140,92,${.52+Math.random()*.28})`;x.lineWidth=1.8+Math.random()*1.4;
    x.beginPath();x.moveTo(bx2,by2);x.quadraticCurveTo(bx2+7,by2-bh2*.6,bx2+3,by2-bh2);x.stroke();
    for(let j=0;j<5;j++){
      const ly=by2-bh2*(.42+j*.11);
      x.strokeStyle='rgba(96,128,84,.44)';x.lineWidth=1.2;
      x.beginPath();x.moveTo(bx2+3,ly);x.quadraticCurveTo(bx2+16,ly-6,bx2+25,ly-2);x.stroke();
      x.beginPath();x.moveTo(bx2+1,ly+2);x.quadraticCurveTo(bx2-12,ly-3,bx2-22,ly);x.stroke();
    }
  }

  // 寻芳场景：加梅花
  if(X.k==='hope'){
    for(let i=0;i<14;i++){
      const fx=rnd(W2*.08,W2*.36),fy=rnd(wy*.8,wy*.98);
      x.beginPath();x.arc(fx,fy,rnd(3,7),0,6.28);
      x.fillStyle=hexA('#fce8f0',rnd(.6,.9));x.fill();
    }
  }
  // 扫竹场景：有倒伏竹影
  if(X.k==='ang'){
    x.strokeStyle='rgba(80,110,70,.22)';x.lineWidth=2.5;
    x.beginPath();x.moveTo(W2*.12,wy+wh);x.quadraticCurveTo(W2*.35,wy+wh+12,W2*.55,wy+wh+6);x.stroke();
  }

  // 丁达尔光柱
  x.save();x.globalCompositeOperation='screen';
  for(let i=0;i<4;i++){
    const llx=W2*(.14+i*.20);
    const llg=x.createLinearGradient(llx,0,llx+W2*.09,H*.72);
    llg.addColorStop(0,hexA('#fff5d8',.30*(.4+X.warm)));llg.addColorStop(1,'rgba(255,245,216,0)');
    x.fillStyle=llg;
    x.beginPath();x.moveTo(llx,0);x.lineTo(llx+W2*.06,0);
    x.lineTo(llx+W2*.16,H*.74);x.lineTo(llx+W2*.05,H*.74);x.closePath();x.fill();
  }
  x.restore();

  // 题跋 + 朱砂印
  x.fillStyle='rgba(44,40,32,.88)';
  x.font=`${Math.round(W2*.054)}px "Songti SC",STSong,serif`;
  x.textAlign='left';x.fillText(X.name.replace(' · ','　'),W2*.09,H*.072);
  x.font=`${Math.round(W2*.028)}px "Songti SC",STSong,serif`;
  x.fillStyle='rgba(88,80,66,.80)';x.fillText(X.song,W2*.09,H*.106);
  x.font=`${Math.round(W2*.022)}px "Songti SC",STSong,serif`;
  x.fillStyle='rgba(116,106,86,.68)';
  x.fillText(`${bz.pillars.join(' ')} · ${X.hn} ${X.el}入${ZANG[X.el].zang} · ${S.jd.type}`,W2*.09,H*.955);
  // 朱砂印章
  x.strokeStyle='rgba(168,81,47,.82)';x.lineWidth=2;
  const sx=W2*.80,sy=H*.882,ss=W2*.105;
  x.strokeRect(sx,sy,ss,ss);
  x.fillStyle='rgba(168,81,47,.84)';
  x.font=`${Math.round(ss*.38)}px "Songti SC",STSong,serif`;
  x.textAlign='center';
  x.fillText('心园',sx+ss*.5,sy+ss*.46);
  x.fillText('留念',sx+ss*.5,sy+ss*.86);
}

/* ════════════════ 落印报告 ════════════════ */
function finish(){
  $('#hud').classList.remove('on');
  document.querySelectorAll('.spark').forEach(s=>s.remove());
  const X=S.x,bz=S.bazi,jd=S.jd;
  const dur=Math.round((performance.now()-S.t0)/1000);
  const tempo=dur<26?'急':dur<54?'匀':'缓';
  const tempoTxt={急:'你走得很快，几乎没有停顿——身体在提示你想尽快脱离这个状态。',
    匀:'你的节奏平稳，说明此刻你的注意力有地方可以安放。',
    缓:'你在园子里停留得久，反复停在同一处——这是身体在给情绪一个出口，不急。'}[tempo];
  const second=S.picks[1]?BY_K[S.picks[1]]:null, third=S.picks[2]?BY_K[S.picks[2]]:null;
  const tot=Object.values(bz.cnt).reduce((a,b)=>a+b,0);
  const padTxt=`愉悦度${{'-2':'很低','-1':'偏低','1':'一般','2':'较高','3':'高'}[S.pad.P]||'-'}　唤醒度${{'-2':'很低','-1':'偏低','1':'一般','2':'较高','3':'高'}[S.pad.A]||'-'}　掌控感${{'-2':'很低','-1':'偏低','1':'一般','2':'较高','3':'高'}[S.pad.D]||'-'}`;

  paintScroll();
  showSil(true);
  $('#scrollwrap').classList.add('on');
  setTimeout(()=>saySomething(X.act_cure,true,'btm'),920);

  $('#rep').innerHTML=`
    <div class="stamp">心园<br>留念</div>
    <div class="verdict">${X.act_cure}</div>
    <div class="vsrc">心 园 落 印 · ${X.name}</div>

    <div class="card">
      <div class="ctag">其 一 · 情 绪 三 维 测 得</div>
      <div class="ctitle">${X.emo}（${X.emo2}）</div>
      <div class="ctxt">${padTxt}<br><br>
        你先取<b>${X.hn}</b>，此色属<b>${X.el}</b>，入<b>${ZANG[X.el].zang}</b>，${ZANG[X.el].fn}，其志为<b>${ZANG[X.el].zhi}</b>。
        今日这份<em>${X.emo}</em>，说到底是<b>${X.zhiTxt}</b>。
        ${second?`旁边还有${second.hn}（${second.el}·${second.emo}）${third?`与${third.hn}`:''}牵着——这不是一种情绪，是一组。`:''}
      </div>
      <div class="row">
        <div class="chip"><i>情 志</i><b>${ZANG[X.el].zhi}</b></div>
        <div class="chip"><i>所 属</i><b>${ZANG[X.el].zang}</b></div>
        <div class="chip"><i>分 量</i><b>${DEGW[S.deg]}</b></div>
      </div>
    </div>

    <div class="card">
      <div class="ctag">其 二 · 命 局 相 参</div>
      <div class="ctitle">${jd.head}　·　${jd.type}</div>
      <div class="ctxt">${jd.body}<br><br><b>调法：</b>${jd.fix}</div>
      <div class="bars">
        ${['木','火','土','金','水'].map(e=>{
          const pc=bz.cnt[e]/tot;
          return `<div class="bar"><u>${e}</u><s><i style="width:${Math.min(100,(pc*280)).toFixed(0)}%;background:${EL_COLOR[e]};opacity:${e===X.el?1:.46}"></i></s>
          <em>${ZANG[e].zang}·${ZANG[e].zhi}</em></div>`;}).join('')}
      </div>
      <div class="ctxt" style="margin-top:10px;font-size:11px;color:#8d8471">
        ${bz.pillars.join('　')}　日主${bz.dayGan}（${bz.dayEl}）
      </div>
    </div>

    <div class="card">
      <div class="ctag">其 三 · 行 为 读 数</div>
      <div class="ctitle">${X.ice}</div>
      <div class="ctxt">${X.act_cbt}<br><br>${tempoTxt}
        <br><br>造园历时 <b>${dur}s</b>（${tempo}）　抹雾 <b>${Math.round(S.trace.wipe)}px</b>　理水 <b>${S.trace.flow.toFixed(1)}</b>　承光 <b>${S.trace.catch}</b> 次${S.trace.breaks?`　扫竹 <b>${S.trace.breaks}</b> 棵`:''}
      </div>
    </div>

    <div class="card">
      <div class="ctag">其 四 · 今 日 三 件 事（可执行）</div>
      <div class="ctitle">不需要今天就想明白，只需要做这三件</div>
      <div class="act-row">
        <p><b>认 知</b>　${X.act_cbt}</p>
        <p><b>行 为</b>　${X.act_do}</p>
        <p><b>养 气</b>　${X.act_body}</p>
      </div>
    </div>

    <div class="card">
      <div class="ctag">其 五 · 如 何 开 口</div>
      <div class="ctitle">一句话，不用解释，不用道歉</div>
      <div class="ctxt">${X.act_link}</div>
    </div>

    <div class="foot">
      园 无 死 局 　 移 步 自 成 景<br>
      本页为心理自助体验，不构成医疗诊断<br>
      持续低落逾两周，请寻求专业帮助
    </div>
    <button class="again" id="again">再 造 一 园</button>
  `;

  $('#scrollc').onclick=()=>{
    $('#scrollwrap').classList.remove('on');
    hideSay(); showSil(false);
    setTimeout(()=>{$('#rep').classList.add('on');$('#rep').scrollTop=0;
      $('#again').onclick=resetGame;},420);
  };
  $('#scrolltip').textContent='点 画 · 看 判 语';
}
function resetGame(){
  $('#rep').classList.remove('on');hideSay();showSil(false);
  W.wuni.uRip.value.forEach(v=>v.set(0,0,0));FOG.hide();
  W.bams.forEach(g=>{g.userData.alive=true;g.scale.setScalar(1);g.position.y=0;g.rotation.z=g.userData.base;g.visible=true;});
  if(W.dewDrops) W.dewDrops.forEach(d=>{d.userData.caught=false;d.visible=true;});
  if(W.wildShadows) W.wildShadows.forEach(s=>{s.visible=true;s.scale.setScalar(1);s.material.opacity=.26;});
  if(W.looseStones) W.looseStones.forEach(st=>{st.userData.placed=false;st.position.set(...st.userData.home);});
  BREATH.active=false;
  const bb=$('#breathbox'); if(bb) bb.remove();
  W.hemi.intensity=1.1;
  fadeTo(()=>{INK.clear();S.qIdx=0;S.pad={P:0,A:0,D:0};show('#s_quiz');renderQuiz();
    setTimeout(()=>saySomething('再来一次，今日与昨日总是不同的。',false,'btm'),400);});
}

/* ════════════════ 启动 ════════════════ */
initGL();
</script>
